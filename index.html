// Réduit une image (max 1600px, JPEG 0.8) pour un upload léger, puis renvoie {base64, name}
function resizeImageToBase64(file, maxDim){
  maxDim = maxDim || 1600;
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let { width:w, height:h } = img;
      if(Math.max(w,h) > maxDim){ const r=maxDim/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      const dataUrl=cv.toDataURL("image/jpeg",0.8);
      resolve({ base64:dataUrl.split(",")[1], name:(file.name||"photo").replace(/\.[^.]+$/,"")+".jpg" });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Image illisible")); };
    img.src=url;
  });
}

// Valide un code vendeur côté serveur (registre central). Renvoie true/false.

async function verifyVendorCode(code){
  if(!APPS_SCRIPT_READY()) throw new Error("Configuration serveur manquante (APPS_SCRIPT_URL).");
  const res = await fetch(APPS_SCRIPT_URL, {
    method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"verify-code", code, storeCode:STORE.code })
  });
  const json = await res.json();
  return !!(json && json.valid);
}

// Envoie la photo à Google Drive via Apps Script et renvoie l'URL du fichier.
async function uploadPhotoToDrive(file){
  if(!APPS_SCRIPT_READY()) throw new Error("Apps Script non configuré (photos indisponibles).");
  const { base64, name } = await resizeImageToBase64(file);
  const res = await fetch(APPS_SCRIPT_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" }, // requête "simple" => pas de préflight CORS
    body: JSON.stringify({ action:"upload-photo", storeCode:STORE.code, filename:name, base64 })
  });
  const json = await res.json();
  if(!json || !json.url) throw new Error(json && json.error ? json.error : "Réponse Drive invalide");
  return json.url;
}

const nowISO = () => new Date().toISOString();
function norm(s){ return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function toNum(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
function lineKey(p, idx){ const a=(p.article||"").toString().trim(); return a ? "a_"+a.replace(/[.#$/\[\]]/g,"_") : "i_"+idx; }
function fmtDate(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }

/* ============================== PARSEURS ============================== */
// Sortie commune : { docNumber, supplier, lines:[{article,ean,designation,marque,attendu,label?,nonLivre?}] }

function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return { docNumber:"", supplier:"", lines:[] };
  const head = lines[0].split(";").map(h=>norm(h));
  const col = (names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iType=col(["type de piece"]), iDoc=col(["numero piece"]), iEan=col(["ean"]),
        iRef=col(["reference"]), iDes=col(["designation"]), iQte=col(["qte","qte "]),
        iMar=col(["marque"]), iComm=col(["commentaire"]),
        iFam=col(["famille"]), iRay=col(["rayon"]);
  const out=[]; let docNumber="";
  for(let r=1;r<lines.length;r++){
    const c=lines[r].split(";"); if(c.length<3) continue;
    const type=(iType>=0?c[iType]:"").trim();
    const article=(iRef>=0?c[iRef]:"").trim();
    const des=(iDes>=0?c[iDes]:"").trim();
    if(!article && !des) continue;
    const nonLivre=/non\s*livr/i.test(type);
    if(iDoc>=0 && c[iDoc] && !docNumber && !nonLivre) docNumber=c[iDoc].trim();
    const fam=(iFam>=0?c[iFam]:"").trim(), ray=(iRay>=0?c[iRay]:"").trim();
    out.push({
      article, ean:(iEan>=0?c[iEan]:"").trim().replace(/^0+(?=\d)/,""),
      designation:des, marque:(iMar>=0?c[iMar]:"").trim(),
      attendu:toNum(iQte>=0?c[iQte]:0),
      categorie: (fam||ray||"Autres"),
      comment:(iComm>=0?(c[iComm]||"").trim():""), nonLivre
    });
  }
  return { docNumber, supplier:"", lines: out };
}

function parseTXT(text){
  const rows=text.split(/\r?\n/); const out=[]; let docNumber=""; let skipped=0;
  const dateRe=/^\d{2}\/\d{2}\/\d{4}$/;
  for(const raw of rows){
    if(!raw.trim()) continue;
    const c=raw.split("\t");
    if(c.length<9 || !dateRe.test((c[2]||"").trim())){ skipped++; continue; }
    const article=(c[4]||"").trim(), des=(c[5]||"").trim(), qte=toNum(c[8]);
    if(!article || !des){ skipped++; continue; }
    if(c[3]) docNumber=(c[3]||"").trim();
    out.push({ article, ean:"", designation:des, marque:"", attendu:qte, categorie:"Autres", label:(c[6]||"").trim() });
  }
  return { docNumber, supplier:"", lines: out, skipped };
}

function parsePDFLines(rowLines){
  const out=[]; let supplier=""; let docNumber="";
  const lineRe=/^(\d{2,7})\s+(.*\S)\s+(\d{8,13})\s+(\d+)\s+[\d.,]+\s+[\d.,]+\s*$/;
  for(const L of rowLines){
    if(!supplier && /VITAFRAIS/i.test(L)) supplier="VITAFRAIS";
    const mBL=L.match(/n[°º]\s*BL\s*:?\s*(\d+)/i); if(mBL) docNumber=mBL[1];
    if(/^(Palette|Colis \d|Poids|Total|Distribution|Page|Commande|BIO :|DEM :)/i.test(L)) continue;
    const m=L.match(lineRe); if(!m) continue;
    out.push({ article:m[1], ean:m[3].replace(/^0+(?=\d)/,""),
               designation:m[2].replace(/\s+\d+$/,"").trim(), marque:"", attendu:parseInt(m[4],10), categorie:"Autres" });
  }
  return { docNumber, supplier, lines: out };
}

// Lit un PDF (ArrayBuffer) -> lignes visuelles groupées par y, puis parsePDFLines
async function readPDF(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let rowLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4], it.str]); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim();
      if(line) rowLines.push(line);
    });
  }
  return parsePDFLines(rowLines);
}

// Détecte le format et renvoie la sortie commune
async function parseAnyFile(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".pdf")){
    const buf=await file.arrayBuffer();
    return { ...(await readPDF(buf)), format:"PDF" };
  }
  // CSV/TXT : décoder en Windows-1252 (les BL Elibio sont en ANSI)
  const buf=await file.arrayBuffer();
  let text;
  try { text=new TextDecoder("windows-1252").decode(buf); }
  catch(e){ text=new TextDecoder("utf-8").decode(buf); }
  // heuristique : contient des tabulations -> TXT tabulé ; sinon CSV ;
  const firstLines=text.split(/\r?\n/).slice(0,5).join("\n");
  if(name.endsWith(".csv") || firstLines.includes(";")){
    // si beaucoup de tabulations et pas de ; -> TXT
    if(!firstLines.includes(";") && firstLines.includes("\t")) return { ...parseTXT(text), format:"TXT" };
    return { ...parseCSV(text), format:"CSV" };
  }
  return { ...parseTXT(text), format:"TXT" };
}

// Valide une réception (compteur d'écarts, figeage Firebase, envoi Apps Script).
// Partagé par l'écran Récap et la validation depuis l'accueil.
async function validateReceptionCore({ recId, doc, operatorCode, lineStates, activeLines }){
  const ecarts=[]; let conf=0, ecart=0, none=0;
  activeLines.forEach((l,i)=>{ const s=lineStates[lineKey(l,i)];
    if(!s||!s.status){ none++; return; }
    if(s.status==="conforme") conf++; else { ecart++; ecarts.push({ line:l, s }); }
  });
  const validatedAt=Date.now();
  const ecartsPayload=[];
  for(const e of ecarts){
    let num=null;
    await db.ref("counters/ecart").transaction(cur=>{ num=(cur||111)+1; return num; });
    ecartsPayload.push({ num, article:e.line.article, designation:e.line.designation,
      attendu:e.line.attendu, reel:e.s.reel, text:e.s.ecartText||"", photo:e.s.photoUrl||"" });
  }
  await db.ref("receptions/"+recId).update({ status:"validated", validatedAt, lines:lineStates,
    ecarts:ecartsPayload, ecartCount:ecartsPayload.length });
  const rows=[["Code article","Designation","Attendu","Statut","Reel apte vente","Commentaire ecart","Photo"]];
  activeLines.forEach((l,i)=>{ const s=lineStates[lineKey(l,i)]||{};
    rows.push([l.article,l.designation,l.attendu, s.status||"non pointe", s.reel!=null?s.reel:"", s.ecartText||"", s.photoUrl||""]); });
  const csv=rows.map(r=>r.map(c=>{ const v=String(c==null?"":c); return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(";")).join("\n");
  const payload={ action:"log-reception", appName:STORE.appName, store:STORE.label, storeCode:STORE.code,
    supplier:doc.supplier, docType:doc.type||"BL", docNumber:doc.docNumber, operatorCode,
    validatedAt:new Date(validatedAt).toISOString(),
    totals:{ total:activeLines.length, conformes:conf, ecarts:ecart, nonPointes:none },
    ecarts:ecartsPayload, csv };  // destinataire défini côté Apps Script (ADMIN_EMAIL)
  if(APPS_SCRIPT_READY()){ try{ await fetch(APPS_SCRIPT_URL,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) }); }catch(e){} }
  return { conf, ecart, none, total:activeLines.length };
}

// Connexion Google du responsable (entrepôt). Vérifie l'email côté serveur (RESPONSABLE_EMAILS).
function ResponsableLogin({ onAuthed }){
  const ref=useRef(); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  useEffect(()=>{
    if(!OAUTH_READY()) return;
    let tries=0; const t=setInterval(()=>{
      if(window.google && google.accounts && google.accounts.id){
        clearInterval(t);
        google.accounts.id.initialize({ client_id:OAUTH_CLIENT_ID, callback: async (resp)=>{
          setBusy(true); setErr("");
          try{
            const r=await fetch(APPS_SCRIPT_URL,{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
              body:JSON.stringify({ action:"verify-responsable", idToken:resp.credential }) });
            const j=await r.json();
            if(j && j.allowed) onAuthed();
            else setErr("Accès refusé : "+((j&&j.email)||"")+" n'est pas autorisé.");
          }catch(e){ setErr("Erreur : "+e.message); }
          setBusy(false);
        }});
        try{ google.accounts.id.renderButton(ref.current,{ theme:"outline", size:"large", text:"signin_with" }); }catch(e){}
      } else if(++tries>50) clearInterval(t);
    },150);
    return ()=>clearInterval(t);
  },[]);
  if(!OAUTH_READY()) return null;
  return (
    <div style={{marginTop:20,textAlign:"center"}}>
      <div className="small-note" style={{marginBottom:8}}>Responsable / entrepôt :</div>
      <div ref={ref} style={{display:"flex",justifyContent:"center"}}></div>

  );
}

function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[data-dyn="'+src+'"]')){res();return;} const s=document.createElement('script'); s.src=src; s.async=true; s.setAttribute('data-dyn',src); s.onload=()=>res(); s.onerror=()=>rej(new Error('load '+src)); document.head.appendChild(s); }); }
const ZXING_SRC='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
function ScanModal({ onCode, onClose }){
  const videoRef=useRef(); const streamRef=useRef(); const zxRef=useRef(); const timerRef=useRef(); const lastRef=useRef({c:"",t:0});
  const [status,setStatus]=useState("init"); const [err,setErr]=useState("");
  const FORMATS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39'];
  const emit=(raw)=>{ const code=String(raw||"").trim(); if(!code) return; const now=Date.now();
    if(code===lastRef.current.c && now-lastRef.current.t<1500) return; lastRef.current={c:code,t:now};
    try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} onCode(code); };
  useEffect(()=>{ let cancelled=false;
    (async()=>{
      try{
        const stream=await navigator.mediaDevices.getUserMedia({ video:{facingMode:{ideal:'environment'}}, audio:false });
        if(cancelled){ stream.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current=stream; const v=videoRef.current; v.srcObject=stream; v.setAttribute('playsinline','true'); v.muted=true; await v.play().catch(()=>{});
        let supported=[]; if('BarcodeDetector' in window){ try{ supported=await window.BarcodeDetector.getSupportedFormats(); }catch(e){} }
        if(supported.length && FORMATS.some(f=>supported.includes(f))){
          const det=new window.BarcodeDetector({ formats:FORMATS.filter(f=>supported.includes(f)) });
          setStatus("run");
          const tick=async()=>{ if(cancelled) return; try{ const codes=await det.detect(v); if(codes&&codes.length) emit(codes[0].rawValue); }catch(e){} timerRef.current=setTimeout(tick,180); };
          tick();
        } else {
          await loadScript(ZXING_SRC); if(cancelled) return; const ZX=window.ZXing;
          if(!ZX||!ZX.BrowserMultiFormatReader) throw new Error("Lecteur indisponible");
          const reader=new ZX.BrowserMultiFormatReader(); zxRef.current=reader; setStatus("run");
          reader.decodeFromStream(stream, v, (result)=>{ if(!cancelled&&result) emit(result.getText?result.getText():result.text); }).catch(()=>{});
        }
      }catch(e){ if(!cancelled){ setStatus("err"); setErr(e.name==='NotAllowedError'?"Caméra refusée. Autorise la caméra dans le navigateur.":(e.message||String(e))); } }
    })();
    return ()=>{ cancelled=true; if(timerRef.current) clearTimeout(timerRef.current); try{ zxRef.current&&zxRef.current.reset(); }catch(e){} try{ const s=streamRef.current; if(s) s.getTracks().forEach(t=>t.stop()); }catch(e){} };
  },[]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Scanner un code-barres</h3>
        <div style={{position:"relative",width:"100%",borderRadius:10,overflow:"hidden",background:"#000",aspectRatio:"4 / 3"}}>
          <video ref={videoRef} muted playsInline style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
            <div style={{width:"74%",height:"30%",border:"2px solid rgba(255,255,255,.9)",borderRadius:10}}/>
          </div>
        </div>
        <div className="small-note" style={{marginTop:8}}>
          {status==="init"&&"Démarrage de la caméra…"}
          {status==="run"&&"Vise un code-barres — l'article correspondant apparaît dans la liste."}
          {status==="err"&&("⚠️ "+err)}
        </div>
        <button className="btn-secondary" onClick={onClose}>Fermer</button>
      </div>
    </div>
  );
}

            <button className={"btn-nonconf"+(st.status==="ecart"?" on":"")} onClick={onEcart}>Non conforme</button>
            <button className={"btn-nonrecu"+(st.status==="nonrecu"?" on":"")} onClick={onNonRecu}>Pas reçu</button>
          </div>
        </div>
      )}
      {st.status && (
        <div className="line-state">
          {st.status==="conforme"
            ? <span>✓ Conforme — <b>{st.reel!=null?st.reel:line.attendu}</b> reçu et apte vente</span>
            : st.status==="nonrecu"
              ? <span>✗ <b>Pas reçu</b> — 0 sur {line.attendu} attendu(s)</span>

        </div>

function ReceptionScreen({ operator, doc, reception, onExit, onGoRecap }){
  // reception: objet existant (draft) ou null -> on crée
  const [recId,setRecId]=useState(reception?.id||null);
  const [lineStates,setLineStates]=useState(()=> (reception?.lines)||{});
  const [search,setSearch]=useState("");
  const [ecartFor,setEcartFor]=useState(null); // {line, lk}
  const [toast,setToast]=useState("");
  const [scanOpen,setScanOpen]=useState(false); // scanner code-barres
  const [showDone,setShowDone]=useState(false); // encart "Réceptionné" replié
  const readOnly = reception && reception.status==="validated";

  const activeLines = useMemo(()=> (doc.lines||[]).filter(l=>!l.nonLivre), [doc]);
  const nonLivres = useMemo(()=> (doc.lines||[]).filter(l=>l.nonLivre), [doc]);

  // Crée le draft si nécessaire
  useEffect(()=>{ let cancelled=false;
    (async()=>{
      if(recId || readOnly || !db) return;
      const ref=db.ref("receptions").push();
      const rec={ docId:doc.id, docNumber:doc.docNumber, supplier:doc.supplier, type:doc.type||"BL",
        storeCode:STORE.code, storeLabel:STORE.label, appName:STORE.appName,
        operatorCode:operator.code,   // pas de nom : seul le code est stocké
        status:"draft", createdAt:firebase.database.ServerValue.TIMESTAMP, updatedAt:firebase.database.ServerValue.TIMESTAMP, lines:{} };
      await ref.set(rec);
      if(!cancelled) setRecId(ref.key);
    })();
    return ()=>{ cancelled=true; };
  },[]);

  // Live : suit les pointages des autres vendeurs sur la MÊME réception, en temps réel.
  useEffect(()=>{ if(!db || !recId || readOnly) return;
    const r=db.ref("receptions/"+recId+"/lines");
    const cb=s=>setLineStates(s.val()||{});
    r.on("value",cb); return ()=>r.off("value",cb);
  },[recId,readOnly]);

  // Écriture PAR LIGNE : deux vendeurs peuvent pointer la même réception sans s'écraser.
  const persistLine=useCallback(async(lk,obj)=>{
    setLineStates(prev=>({ ...prev, [lk]:obj }));
    if(readOnly || !recId || !db) return;
    try{
      await db.ref("receptions/"+recId+"/lines/"+lk).set(obj);
      await db.ref("receptions/"+recId).update({ updatedAt:firebase.database.ServerValue.TIMESTAMP });
    }catch(e){}
  },[recId,readOnly]);
  const clearLine=useCallback(async(lk)=>{
    setLineStates(prev=>{ const n={...prev}; delete n[lk]; return n; });
    if(readOnly || !recId || !db) return;
    try{ await db.ref("receptions/"+recId+"/lines/"+lk).remove(); }catch(e){}
  },[recId,readOnly]);

  const setConforme=(line,lk)=>{
    persistLine(lk,{ status:"conforme", reel:line.attendu, article:line.article, ean:line.ean||"", designation:line.designation, attendu:line.attendu });
    setToast("Conforme : "+line.designation); setTimeout(()=>setToast(""),1200);
  };
  const saveEcart=(line,lk,data)=>{
    persistLine(lk,{ status:"ecart", reel:data.reel, ecartText:data.ecartText, photoUrl:data.photoUrl||"",
      article:line.article, ean:line.ean||"", designation:line.designation, attendu:line.attendu });
    setEcartFor(null);
  };
  const setNonRecu=(line,lk)=>{
    persistLine(lk,{ status:"nonrecu", reel:0, ecartText:"NON REÇU",
      article:line.article, ean:line.ean||"", designation:line.designation, attendu:line.attendu });
    setToast("Pas reçu : "+line.designation); setTimeout(()=>setToast(""),1200);
  };

  const filtered=useMemo(()=>{
    const q=norm(search);
    if(!q) return activeLines;
    const last4 = /^\d{4}$/.test(search.trim());
    return activeLines.filter(l=>{
      if(last4 && String(l.ean).slice(-4)===search.trim()) return true;
      return norm(l.designation).includes(q) || norm(l.marque).includes(q) ||
             norm(l.article).includes(q) || norm(l.ean).includes(q);
    });
  },[search,activeLines]);

  const doneCount = activeLines.reduce((n,l,i)=> n + (lineStates[lineKey(l,i)]?.status?1:0), 0);
  const ecartCount = activeLines.reduce((n,l,i)=> { const s=lineStates[lineKey(l,i)]?.status; return n + (s==="ecart"||s==="nonrecu"?1:0); }, 0);

  // Liste simple (SANS tri par catégorie) : uniquement les lignes non encore pointées.
  const todo = useMemo(()=> filtered.filter(l=> !lineStates[lineKey(l,activeLines.indexOf(l))]?.status), [filtered,lineStates,activeLines]);
  const doneList = useMemo(()=> activeLines.filter(l=> lineStates[lineKey(l,activeLines.indexOf(l))]?.status), [activeLines,lineStates]);

  return (
    <div className="app">
      <div className="header"><div className="header-row">
        <div><h1>{doc.supplier||"BL"} {doc.docNumber}</h1>
          <div className="sub">{readOnly?"Réception validée (lecture seule)":"Pointage en cours"}</div></div>
        <button className="header-btn" onClick={onExit}>Accueil</button>
      </div></div>

      <div className="search-bar" style={{display:"flex",gap:8}}>
        <input style={{flex:1}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Rechercher : mot-clé, marque, EAN…"/>
        {!readOnly && <button className="header-btn" style={{background:"#1a4d2e",color:"#fff",padding:"0 14px",fontSize:20,borderRadius:8}} onClick={()=>setScanOpen(true)} title="Scanner un code-barres">📷</button>}
        {search && <button className="header-btn" style={{background:"#eef2f7",color:"#333"}} onClick={()=>setSearch("")}>✕</button>}
      </div>

      {scanOpen && <ScanModal onCode={(code)=>{ setSearch(code); setScanOpen(false); }} onClose={()=>setScanOpen(false)}/>}

      <div className="product-list">
        {todo.map((l,i)=>{ const lk=lineKey(l, activeLines.indexOf(l));
          return <ProductCard key={lk+"_"+i} line={l} lk={lk} state={lineStates[lk]} readOnly={readOnly}
            onConforme={()=>setConforme(l,lk)} onEcart={()=>setEcartFor({line:l,lk})} onNonRecu={()=>setNonRecu(l,lk)}/>;
        })}
        {todo.length===0 && <div className="small-note" style={{padding:16}}>{doneList.length>0?"Tout est pointé ✓ — vérifie l'encart Réceptionné puis valide.":"Aucun article à pointer."}</div>}

        {doneList.length>0 && (
          <div style={{marginTop:16}}>
            <button className="cat-head done-head" onClick={()=>setShowDone(v=>!v)}>
              <span className="cat-name">✓ Réceptionné ({doneList.length})</span>
              <span className="cat-count"><span className="chev">{showDone?"▾":"▸"}</span></span>
            </button>
            {showDone && doneList.map((l)=>{ const lk=lineKey(l,activeLines.indexOf(l)); const st=lineStates[lk]||{};
              const clsx="product-card "+(st.status==="conforme"?"conforme":st.status==="nonrecu"?"nonrecu":"ecart");
              return (
                <div key={"d"+lk} className={clsx}>
                  <div className="designation">{l.designation}</div>
                  <div className="line-state">
                    {st.status==="conforme"?<span>✓ Conforme — <b>{st.reel!=null?st.reel:l.attendu}</b></span>
                     :st.status==="nonrecu"?<span>✗ <b>Pas reçu</b></span>
                     :<span>⚠ Écart — reçu <b>{st.reel}</b>{st.ecartText?" — "+st.ecartText:""}{st.photoUrl && <a href={st.photoUrl} target="_blank" rel="noreferrer" style={{marginLeft:8}}>📷</a>}</span>}
                  </div>
                  {!readOnly && <button className="btn-secondary" style={{marginTop:8}} onClick={()=>clearLine(lk)}>Corriger</button>}
                </div>
              );
            })}
          </div>
        )}

        {nonLivres.length>0 && (
          <div style={{marginTop:16}}>
            <div className="small-note"><b>Non livrés / sur commande ({nonLivres.length})</b> — non à pointer :</div>
            {nonLivres.map((l,i)=>(<div key={"nl"+i} className="doc-card" style={{opacity:.6}}>
              <div className="t" style={{fontSize:13}}>{l.designation}</div>
              <div className="m">{l.comment||"Non livré"}</div></div>))}
          </div>
        )}
      </div>

      {ecartFor && <EcartModal line={ecartFor.line} current={lineStates[ecartFor.lk]}
        onSave={(data)=>saveEcart(ecartFor.line, ecartFor.lk, data)} onClose={()=>setEcartFor(null)}/>}

      <div className="bottom-bar">
        <div className="stats">
          <span>Pointés : {doneCount}/{activeLines.length}</span>
          <span>Écarts : {ecartCount}</span>
        </div>
        {readOnly
          ? <button className="btn-finish" onClick={onExit}>Retour accueil</button>
          : <button className="btn-finish" onClick={()=>onGoRecap({ id:recId, lineStates, activeLines })}>Voir le récapitulatif</button>}
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ============================ RÉCAP + VALIDATION ==================== */
function RecapScreen({ operator, doc, recId, lineStates, activeLines, onBack, onValidated }){
  const [confirming,setConfirming]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");

  const stats=useMemo(()=>{
    let conf=0, ecart=0, none=0; const ecarts=[];
    activeLines.forEach((l,i)=>{ const s=lineStates[lineKey(l,i)];
      if(!s||!s.status){ none++; return; }
      if(s.status==="conforme") conf++;
      else { ecart++; ecarts.push({ line:l, s }); }
    });
    return { total:activeLines.length, conf, ecart, none, ecarts };
  },[lineStates,activeLines]);

  const validate=async()=>{
    setBusy(true); setErr("");
    try{
      await validateReceptionCore({ recId, doc, operatorCode:operator.code, lineStates, activeLines });
      onValidated();  // App affiche le popup "terminé ? déconnexion"
    }catch(e){ setErr("Erreur validation : "+e.message); }
    setBusy(false);
  };

  return (
    <div className="app">
      <div className="header"><div className="header-row">
        <div><h1>Récapitulatif</h1><div className="sub">{doc.supplier} {doc.docNumber}</div></div>
        <button className="header-btn" onClick={onBack}>Retour</button>
      </div></div>

      <div className="recap-section">
        <div className="recap-card">
          <h3>Résumé</h3>
          <div className="recap-stat"><span className="label">Lignes à pointer</span><span className="value">{stats.total}</span></div>
          <div className="recap-stat"><span className="label">Reçu conforme</span><span className="value">{stats.conf}</span></div>
          <div className="recap-stat"><span className="label">Écarts (non conforme / pas reçu)</span><span className="value">{stats.ecart}</span></div>
          <div className="recap-stat"><span className="label">Non pointés</span><span className="value">{stats.none}</span></div>
        </div>

        {stats.ecarts.length>0 && (
          <div className="recap-card">
            <h3>Écarts ({stats.ecarts.length})</h3>
            {stats.ecarts.map((e,i)=>(
              <div key={i} className="anomaly-item">
                <div className="product">{e.line.designation}</div>
                <div className="detail">Attendu {e.line.attendu} → reçu apte vente <b>{e.s.reel}</b>{e.s.ecartText?" — "+e.s.ecartText:""}</div>
                {e.s.photoUrl && <a href={e.s.photoUrl} target="_blank" rel="noreferrer">📷 voir la photo</a>}
              </div>
            ))}
          </div>
        )}

        {!confirming
          ? <button className="btn-finish" onClick={()=>setConfirming(true)}>Valider la réception</button>
          : (
            <div className="recap-card">
              <div className="warn-box">Attention : une fois validée, la réception est enregistrée définitivement et ne peut plus être corrigée. En cas d'erreur, il faudra refaire une nouvelle saisie.</div>
              <div style={{fontWeight:700, marginBottom:10}}>Voulez-vous valider ?</div>
              <div className="modal-actions">
                <button className="btn-cancel" onClick={()=>setConfirming(false)} disabled={busy}>NON</button>
                <button className="btn-confirm" onClick={validate} disabled={busy}>{busy?"…":"OUI, valider"}</button>
              </div>
              {err && <div className="err" style={{textAlign:"left"}}>{err}</div>}
            </div>
          )}
      </div>
    </div>
  );
}

function AdminLoad(){
  const [parsed,setParsed]=useState(null);
  const [supplier,setSupplier]=useState("");
  const [docType,setDocType]=useState("BL");
  const [deliveryDate,setDeliveryDate]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState("");
  const fileRef=useRef();
  const fmtFr=(iso)=>{ if(!iso) return ""; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; };

  const onFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    setErr(""); setMsg(""); setBusy(true);
    try{
      const r=await parseAnyFile(f);
      if(!r.lines.length){ setErr("Aucune ligne détectée. Vérifie le format du fichier."); setBusy(false); return; }
      setParsed(r); if(r.supplier) setSupplier(r.supplier);
    }catch(ex){ setErr("Erreur lecture : "+ex.message); }
    setBusy(false);
  };

  const save=async()=>{
    if(!parsed) return; if(!db){ setErr("Firebase non configuré."); return; }
    setBusy(true); setErr("");
    try{
      const ref=db.ref("documents").push();
      await ref.set({ docNumber:parsed.docNumber||"(sans n°)", supplier:supplier.trim()||"(fournisseur ?)",
        type:docType, format:parsed.format, deliveryDate:fmtFr(deliveryDate),
        createdAt:firebase.database.ServerValue.TIMESTAMP, lines:parsed.lines });
      setMsg("Document chargé ✓ Il est visible par le magasin.");
      setParsed(null); setSupplier(""); setDeliveryDate(""); if(fileRef.current) fileRef.current.value="";
    }catch(ex){ setErr("Erreur enregistrement : "+ex.message); }
    setBusy(false);
  };

  return (
    <div className="list-wrap">
      <div className="upload-zone" onClick={()=>fileRef.current&&fileRef.current.click()}>
        <div className="icon">⬆️</div>
        <div className="label">Charger un fichier BL</div>
        <div className="hint">CSV (Elibio), TXT tabulé, ou PDF (Vitafrais)</div>
        <input ref={fileRef} type="file" accept=".csv,.txt,.pdf" style={{display:"none"}} onChange={onFile}/>
      </div>
      {busy && <div className="small-note">Lecture…</div>}
      {err && <div className="err" style={{textAlign:"left"}}>{err}</div>}
      {msg && <div style={{color:"#2e7d32",fontWeight:600,margin:"10px 0"}}>{msg}</div>}

      {parsed && (
        <div style={{marginTop:14}}>
          <div className="field"><label>Fournisseur</label>
            <input value={supplier} onChange={e=>setSupplier(e.target.value)} placeholder="Ex : Elibio, Biodis, Vitafrais…"/></div>
          <div className="field"><label>Type de document</label>
            <select value={docType} onChange={e=>setDocType(e.target.value)}>
              <option>BL</option><option>Facture</option><option>Doc</option></select></div>
          <div className="field"><label>Livraison prévue (date)</label>
            <input type="date" value={deliveryDate} onChange={e=>setDeliveryDate(e.target.value)}/></div>
          <div className="small-note">N° détecté : <b>{parsed.docNumber||"—"}</b> · Format : {parsed.format} · {parsed.lines.length} lignes{parsed.skipped?` · ${parsed.skipped} ligne(s) ignorée(s)`:""}</div>
          <div style={{maxHeight:300,overflow:"auto",marginTop:10,border:"1px solid #e6e8ec",borderRadius:8}}>
            <table className="prev-table"><thead><tr><th>Article</th><th>Désignation</th><th>EAN</th><th>Attendu</th></tr></thead>
              <tbody>{parsed.lines.slice(0,300).map((l,i)=>(
                <tr key={i} style={l.nonLivre?{opacity:.5}:null}>
                  <td>{l.article}</td><td>{l.designation}</td><td>{l.ean}</td><td>{l.nonLivre?"(non livré)":l.attendu}</td></tr>))}</tbody></table>
          </div>
          <button className="btn-primary" style={{marginTop:12}} onClick={save} disabled={busy}>Enregistrer ce document</button>
          <div className="small-note">Rappel CDC : les prix d'achat ne sont jamais enregistrés ni affichés côté magasin.</div>
        </div>
      )}
    </div>
  );
}

function AdminReceptions(){
  const [recs,setRecs]=useState([]);
  const [sel,setSel]=useState(null);
  useEffect(()=>{ if(!db) return; const r=db.ref("receptions"); const cb=s=>{
    const v=s.val()||{}; setRecs(Object.entries(v).map(([id,d])=>({id,...d})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
  }; r.on("value",cb); return ()=>r.off("value",cb); },[]);

  const exportXLSX=()=>{
    const validated=recs.filter(r=>r.status==="validated");
    const ecartsRows=[["Numéro enregistrement","Nom APP","Numéro document","Date Réception","Code article","Texte reçu","Photo reçu (lien)"]];
    const recRows=[["Date réception","Heure validation","Dépôt","Numéro BL","Nom fournisseur","Code réception","Ecarts (o/n)","Ecarts (n°)","Fichier réception"]];
    validated.forEach(r=>{
      const d=new Date(r.validatedAt||r.createdAt);
      const dateStr=d.toLocaleDateString("fr-FR"); const heure=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      const ecarts=r.ecarts||[];
      ecarts.forEach(e=>{ ecartsRows.push([e.num, r.appName||STORE.appName, r.docNumber, dateStr, e.article, e.text||"", e.photo||""]); });
      recRows.push([dateStr, heure, r.storeLabel||STORE.label, r.docNumber, r.supplier, r.operatorCode,
        ecarts.length?"Oui":"Non", ecarts.map(e=>e.num).join("; "), ""]);
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ecartsRows), "Ecarts");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(recRows), "Réceptions");
    XLSX.writeFile(wb, "receptions_"+STORE.code+"_"+new Date().toISOString().slice(0,10)+".xlsx");
  };

  if(sel) return <AdminRecDetail rec={sel} onBack={()=>setSel(null)}/>;
  return (
    <div className="list-wrap">
      <button className="btn-secondary" onClick={exportXLSX} style={{marginBottom:10}}>⬇️ Exporter Excel (Ecarts + Réceptions)</button>
      {recs.length===0 && <div className="small-note">Aucune réception.</div>}
      {recs.map(r=>(
        <div key={r.id} className="doc-card" onClick={()=>setSel(r)}>
          <div className="t">{r.supplier} {r.docNumber}</div>
          <div className="m">
            <span className={"badge "+(r.status==="validated"?"valid":"draft")}>{r.status==="validated"?"Validée":"En cours"}</span>
            <span>{r.storeLabel}</span>
            <span>{fmtDate(r.status==="validated"?r.validatedAt:r.updatedAt||r.createdAt)}</span>
            {r.ecartCount>0 && <span className="badge info">{r.ecartCount} écart(s)</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

  return (
    <div className="list-wrap">
      {docs.length===0 && <div className="small-note">Aucun document chargé.</div>}
      {docs.map(d=>(
        <div key={d.id} className="doc-card">
          <div className="t">{d.supplier} — {d.type} {d.docNumber}</div>
          <div className="m"><span className="badge info">{d.format}</span><span>{(d.lines||[]).length} lignes</span><span>{fmtDate(d.createdAt)}</span>
            <button className="header-btn" style={{background:"#fdecea",color:"#c62828"}} onClick={()=>del(d)}>Supprimer</button></div>
        </div>
      ))}
    </div>
  );
}

// Message push : le responsable écrit un message ; tous les vendeurs de CE magasin
// voient un popup à fermer par validation. (Ciblé par nature : chaque magasin sa base.)
function AdminBroadcast(){
  const [current,setCurrent]=useState(null);
  const [text,setText]=useState("");
  const [msg,setMsg]=useState("");
  useEffect(()=>{ if(!db) return; const r=db.ref("broadcast"); const cb=s=>setCurrent(s.val()); r.on("value",cb); return ()=>r.off("value",cb); },[]);
  const send=async()=>{
    if(!text.trim()) return;
    await db.ref("broadcast").set({ id:String(Date.now()), message:text.trim(), at:firebase.database.ServerValue.TIMESTAMP });
    setText(""); setMsg("Message envoyé aux vendeurs de "+STORE.label+".");
  };
  const clear=async()=>{ await db.ref("broadcast").remove(); setMsg("Message retiré."); };
  return (
    <div className="list-wrap">
      <div className="recap-card">
        <h3>Message aux vendeurs — {STORE.label}</h3>
        <div className="small-note" style={{marginBottom:8}}>S'affiche en popup chez tous les vendeurs de ce magasin. Ils doivent le valider pour le fermer. Ex : « Vous n'aurez pas les yaourts X aujourd'hui, c'est normal. »</div>
        <textarea rows={4} value={text} onChange={e=>setText(e.target.value)} placeholder="Votre message…" style={{width:"100%",padding:12,fontSize:15,border:"1.5px solid #ddd",borderRadius:8}}></textarea>
        <button className="btn-primary" style={{marginTop:10}} onClick={send}>Envoyer à {STORE.label}</button>
        {msg && <div style={{color:"#2e7d32",fontWeight:600,marginTop:8}}>{msg}</div>}
      </div>
      {current && current.message && (
        <div className="recap-card">
          <h3>Message actif</h3>
          <div className="push-msg">{current.message}</div>
          <button className="btn-secondary" onClick={clear}>Retirer le message</button>
        </div>
      )}
    </div>
  );
}

/* ============================== ROOT =============================== */
function App(){
  const connected=useConnection();
  const [operator,setOperator]=useState(null);
  const [view,setView]=useState("login"); // login | home | reception | recap | admin
  const [ctx,setCtx]=useState({}); // {doc, reception} pour reception ; {recId,lineStates,activeLines,doc} pour recap
  const [showLogout,setShowLogout]=useState(false);
  const [bc,setBc]=useState(null);
  const [bcAck,setBcAck]=useState(()=>{ try{ return localStorage.getItem("pribon_bc_ack")||""; }catch(e){ return ""; } });

  useEffect(()=>{ if(!db) return; const r=db.ref("broadcast"); const cb=s=>setBc(s.val()); r.on("value",cb); return ()=>r.off("value",cb); },[]);
  const ackBroadcast=()=>{ if(bc&&bc.id){ try{ localStorage.setItem("pribon_bc_ack",bc.id); }catch(e){} setBcAck(bc.id); } };
  const doLogout=()=>{ setShowLogout(false); setCtx({}); setOperator(null); setView("login"); };
  const showBroadcast = operator && bc && bc.message && bc.id && bc.id!==bcAck && view!=="login" && view!=="admin";

  const configMissing = FIREBASE_CONFIG.databaseURL.includes("__A_REMPLIR__");

  if(configMissing){
    return (
      <div className="screen-center">
        <div className="logo">📦 {STORE.appName}</div>
        <div className="card">
          <h3 style={{marginTop:0}}>Configuration requise</h3>
          <div className="small-note" style={{fontSize:13}}>
            Renseigne <b>FIREBASE_CONFIG</b> (et éventuellement <b>APPS_SCRIPT_URL</b>) en haut du fichier,
            puis recharge. Voir le README fourni.
          </div>
        </div>
      </div>
    );
  }

  return (
    <>
      {view!=="login" && (
        <div style={{position:"fixed",top:6,right:8,zIndex:50}}>
          <span className={"conn-status"+(connected?"":" offline")} style={{color:"#fff",background:connected?"#2e7d32":"#d32f2f"}}>{connected?"● en ligne":"○ hors ligne"}</span>
        </div>
      )}

      {view==="login" && <LoginScreen
        onOperator={(op)=>{ setOperator(op); setView("home"); }}
        onAdmin={()=>setView("admin")}/>}

      {view==="home" && operator && <HomeScreen operator={operator}
        onOpenReception={(doc,reception)=>{ setCtx({doc,reception}); setView("reception"); }}
        onOpenDoc={(rec)=>{ // ouvrir une réception existante : besoin du doc
          db.ref("documents/"+rec.docId).get().then(s=>{ const d=s.val();
            setCtx({ doc:d?{id:rec.docId,...d}:{id:rec.docId,docNumber:rec.docNumber,supplier:rec.supplier,lines:Object.values(rec.lines||{}).map(x=>({article:x.article,designation:x.designation,attendu:x.attendu,ean:"",marque:""}))}, reception:rec });
            setView("reception"); });
        }}
        onAfterValidate={()=>setShowLogout(true)}
        onLogout={()=>{ setOperator(null); setView("login"); }}/>}

      {view==="reception" && operator && ctx.doc && <ReceptionScreen operator={operator} doc={ctx.doc} reception={ctx.reception}
        onExit={()=>setView("home")}
        onGoRecap={({id,lineStates,activeLines})=>{ setCtx(c=>({...c, recId:id, lineStates, activeLines})); setView("recap"); }}/>}

      {view==="recap" && operator && ctx.doc && <RecapScreen operator={operator} doc={ctx.doc}
        recId={ctx.recId} lineStates={ctx.lineStates} activeLines={ctx.activeLines}
        onBack={()=>setView("reception")}
        onValidated={()=>{ setCtx({}); setView("home"); setShowLogout(true); }}/>}

      {view==="admin" && <AdminScreen onExit={()=>setView("login")}/>}

      {showLogout && (
        <div className="modal-backdrop">
          <div className="modal" style={{textAlign:"center"}}>
            <div style={{fontSize:40}}>✅</div>
            <h3>Réception validée</h3>
            <div className="sub">Avez-vous terminé vos réceptions ?<br/><b>Pensez à vous déconnecter</b> pour que personne n'utilise votre code.</div>
            <div className="modal-actions">
              <button className="btn-cancel" onClick={()=>setShowLogout(false)}>Rester connecté</button>
              <button className="btn-confirm" onClick={doLogout}>Me déconnecter</button>
            </div>
          </div>
        </div>
      )}

      {showBroadcast && (
        <div className="modal-backdrop">
          <div className="modal">
            <h3>📢 Message du responsable</h3>
            <div className="push-msg">{bc.message}</div>
            <button className="btn-primary" onClick={ackBroadcast}>J'ai compris</button>
          </div>
        </div>
      )}
    </>
  );
}

const rootEl=document.getElementById("root");
const bs=document.getElementById("boot-screen"); if(bs) bs.remove();
ReactDOM.createRoot(rootEl).render(<App/>);
</script>
</body>
</html>
