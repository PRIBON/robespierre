/* ---- Admin : colisage rétroactif (BDC pour une session DÉJÀ envoyée) ----
   Quand on a oublié de charger le BDC avant d'envoyer le dispatch, on peut
   ici choisir la session envoyée, charger son BDC, et l'app renseigne le
   colisage des produits → les palettes fictives affichent alors les
   colis/cartons estimés (sans avoir à relancer la session). */
function RetroColisage({ allSessions }) {
  const [selectedSid, setSelectedSid] = useState("");
  const [bdcMap, setBdcMap] = useState(null);
  const [info, setInfo] = useState("");
  const [ok, setOk] = useState(false);
  const [busy, setBusy] = useState(false);
  const bdcRef = useRef(null);

  // Sessions envoyées (meta existante), plus récentes d'abord, avec couverture colisage.
  const sessions = useMemo(() => {
    const out = [];
    Object.entries(allSessions||{}).forEach(([sid, s]) => {
      if (!s || !s.meta || !s.meta.startedAt) return;
      const products = s.meta.products || [];
      const withCol = products.filter(p=>p.colisage && p.colisage>1).length;
      out.push({ sid, supplier:s.meta.supplier||"?", startedAt:s.meta.startedAt, total:products.length, withCol });
    });
    out.sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
    return out;
  }, [allSessions]);

  const selected = sessions.find(s=>s.sid===selectedSid) || null;

  const labelOf = (s) => {
    const d = s.startedAt ? new Date(s.startedAt) : null;
    const dstr = d ? d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";
    const cov = s.total>0 ? `${s.withCol}/${s.total} colisés` : "vide";
    return `${s.supplier} — ${dstr} · ${cov}`;
  };

  const handleBdc = async (file) => {
    if (!file) return;
    setInfo(""); setOk(false);
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const map = parseBdcColisage(wb);
      if (map.count===0) { setBdcMap(null); setInfo("⚠️ Aucun colisage détecté dans ce BDC (colonne colisage/conditionnement manquante)."); }
      else { setBdcMap(map); setInfo(`✓ BDC lu : ${map.count} colisage(s) détecté(s). Choisis la session puis applique.`); }
    } catch(e) { setBdcMap(null); setInfo("Erreur BDC : "+e.message); }
    if (bdcRef.current) bdcRef.current.value="";
  };

  const apply = () => {
    if (!bdcMap) { setInfo("Charge d'abord un BDC."); return; }
    if (!selected) { setInfo("Choisis une session."); return; }
    const s = allSessions[selectedSid];
    const products = (s && s.meta && s.meta.products) || [];
    const res = applyColisageWithCount(products, bdcMap);
    if (res.applied===0) {
      setInfo(`Aucun colisage n'a pu être associé (${res.already} déjà renseigné(s), ${res.missing} sans correspondance). Vérifie que le BDC correspond bien à ce fournisseur.`);
      return;
    }
    if (!firebaseReady) { setInfo("Firebase indisponible — impossible d'enregistrer."); return; }
    setBusy(true);
    db.ref(`dispatch/${selectedSid}/meta/products`).set(res.products)
      .then(()=>{ setBusy(false); setOk(true); launchConfetti(); setInfo(`✓ ${res.applied} colisage(s) appliqué(s) à « ${selected.supplier} »${res.missing>0?` (${res.missing} sans correspondance)`:""}. Les palettes fictives sont mises à jour.`); })
      .catch(e=>{ setBusy(false); setInfo("Erreur d'enregistrement : "+e.message); });
  };

  return (
    <div className="recap-card" style={{border:"1.5px solid #5e35b1"}}>
      <h3 style={{color:"#5e35b1"}}>🧾 Colisage oublié ? — session déjà envoyée</h3>
      <p style={{fontSize:12, color:"#666", margin:"0 0 12px 0"}}>Si le dispatch est déjà parti <b>sans BDC</b>, choisis la session, charge son bon de commande, et les palettes fictives afficheront le nombre de colis / cartons estimés. Pas besoin de relancer la session.</p>

      <div className="field">
        <label>Session envoyée</label>
        <select value={selectedSid} onChange={e=>{ setSelectedSid(e.target.value); setOk(false); }}>
          <option value="">— Choisir un dispatch —</option>
          {sessions.map(s=><option key={s.sid} value={s.sid}>{labelOf(s)}</option>)}
        </select>
      </div>
      {sessions.length===0 && <div style={{fontSize:12, color:"#999", marginBottom:8}}>Aucun dispatch envoyé pour l'instant.</div>}
      {selected && selected.withCol===selected.total && selected.total>0 && (
        <div style={{fontSize:12, color:"#2e7d32", background:"#e8f5e9", padding:8, borderRadius:6, marginBottom:8}}>Cette session a déjà un colisage complet sur tous ses produits.</div>
      )}

      <div className="upload-zone bdc" onClick={()=>bdcRef.current&&bdcRef.current.click()} style={{opacity:selectedSid?1:0.5}}>
        <div className="icon">📦</div>
        <div className="label">Charger le BDC de cette session (Excel)</div>
        <div className="hint">colonne colisage / conditionnement</div>
      </div>
      <input ref={bdcRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>handleBdc(e.target.files[0])} />

      <button className="btn-primary" onClick={apply} disabled={!bdcMap || !selected || busy || ok} style={{marginTop:12, background:(!bdcMap||!selected||busy||ok)?"#aaa":"#5e35b1"}}>
        {ok ? "✓ Colisage appliqué" : (busy ? "Enregistrement…" : "Appliquer le colisage à cette session")}
      </button>
      {info && <div style={{fontSize:12, marginTop:10, color:ok?"#2e7d32":(bdcMap?"#5e35b1":"#bf6000"), background:ok?"#e8f5e9":(bdcMap?"#f3effa":"#fff3e0"), padding:8, borderRadius:6}}>{info}</div>}
    </div>
  );
}

/* ---- Admin : Sessions (live/history) ---- */
function AdminSessions({ allSessions, onViewSession }) {
  const [search, setSearch] = useState("");
  const list = useMemo(() => {
    const out = [];
    Object.entries(allSessions||{}).forEach(([sid, s]) => {
      if (!s || !s.meta) return;
      const products = s.meta.products || [];
      const state = s.state || {};
      const total = products.length;
      const done = Object.values(state).filter(x=>x&&x.done).length;
      const ts = Object.values(state).filter(x=>x&&x.doneAt).map(x=>x.doneAt).sort((a,b)=>a-b);
      const ops = new Set(); Object.values(state).forEach(x=>{ if(x&&x.doneBy) ops.add(x.doneBy); });
      out.push({ id:sid, supplier:s.meta.supplier||"?", startedAt:s.meta.startedAt, createdBy:s.meta.createdBy||"", total, done, isLive:total>0&&done<total, durationMs: ts.length?ts[ts.length-1]-ts[0]:0, operators:Array.from(ops), products, state, meta:s.meta });
    });
    out.sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
    return out;
  }, [allSessions]);
  const live = list.filter(s=>s.isLive);
  const history = list.filter(s=>!s.isLive);
  const filteredHistory = useMemo(() => { if(!search.trim()) return history; const q=stripAccents(search.toLowerCase()); return history.filter(s=>stripAccents((s.supplier||"").toLowerCase()).includes(q)||stripAccents((s.createdBy||"").toLowerCase()).includes(q)); }, [history, search]);
  const del = (s) => { if(!confirm((s.isLive?"⚠️ Annuler la session EN COURS ":"Supprimer ")+`"${s.supplier}" ?`)) return; if(firebaseReady) db.ref(`dispatch/${s.id}`).remove().catch(e=>alert("Erreur: "+e.message)); };
  return (
    <>
      <h3 style={{fontSize:14, color:"#c62828", margin:"4px 0 8px"}}>🔴 En cours ({live.length})</h3>
      {live.length===0 && <div style={{color:"#999", fontSize:13, marginBottom:10}}>Aucun dispatch en cours.</div>}
      {live.map(s=><AdminSessionCard key={s.id} session={s} live onClick={()=>onViewSession(s)} onDelete={del} />)}
      <h3 style={{fontSize:14, margin:"14px 0 8px"}}>📋 Historique ({history.length})</h3>
      <input type="text" placeholder="🔍 fournisseur, opérateur…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%", padding:10, fontSize:14, border:"1.5px solid #ddd", borderRadius:8, marginBottom:10}} />
      {filteredHistory.length===0 && <div style={{color:"#999", fontSize:13}}>Aucune session.</div>}
      {filteredHistory.map(s=><AdminSessionCard key={s.id} session={s} live={false} onClick={()=>onViewSession(s)} onDelete={del} />)}
    </>
  );
}
function AdminSessionCard({ session, live, onClick, onDelete }) {
  const s = session; const progress = s.total>0?(s.done/s.total)*100:0;
  const date = s.startedAt ? new Date(s.startedAt) : null;
  const dateStr = date ? date.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
  const timeStr = date ? date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";
  const nbEcarts = Object.values(s.state||{}).reduce((n,x)=>n+((x&&x.ecarts&&x.ecarts.length)||0),0);
  return (
    <div style={{background:"#fff", border:"1.5px solid "+(live?"#d32f2f":"#e6e8ec"), borderRadius:10, padding:12, marginBottom:8}}>

        <div style={{display:"flex", justifyContent:"space-between", alignItems:"start", marginBottom:6}}>
          <div>{live && <span style={{display:"inline-block", background:"#d32f2f", color:"#fff", fontSize:10, fontWeight:700, padding:"2px 6px", borderRadius:10, marginRight:6}}>● LIVE</span>}<span style={{fontWeight:700, fontSize:14}}>{s.supplier}</span></div>
          <div style={{fontSize:11, color:"#999"}}>{dateStr} {timeStr}</div>
        </div>
        <div style={{fontSize:11, color:"#666", marginBottom:8}}>Par <b>{s.createdBy||"?"}</b>{s.operators.length>1 && ` +${s.operators.filter(o=>o!==s.createdBy).join(", ")}`}</div>
        <div style={{display:"flex", gap:12, fontSize:12, marginBottom:6}}>
          <span>📦 <b>{s.done}/{s.total}</b></span>
          {s.durationMs>0 && <span>⏱ {fmtDuration(s.durationMs)}</span>}
          {nbEcarts>0 && <span style={{color:"#c62828"}}>⚠ {nbEcarts} écart(s)</span>}
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`, background:progress===100?"#4caf50":(live?"#ff9800":"#1a4d2e")}}></div></div>
      </div>
      <button onClick={e=>{ e.stopPropagation(); onDelete(s); }} style={{marginTop:8, width:"100%", padding:6, fontSize:12, fontWeight:600, background:"#ffebee", color:"#c62828", border:"1px solid #ffcdd2", borderRadius:6}}>🗑 {live?"Annuler cette session":"Supprimer"}</button>
    </div>
  );
}

/* ---- Admin : Stats ---- */
function AdminStats({ allSessions }) {
  const stats = useMemo(() => {
    const list = [];
    Object.values(allSessions||{}).forEach(s => { if(!s||!s.meta) return; const state=s.state||{}; const done=Object.values(state).filter(x=>x&&x.done).length; const total=(s.meta.products||[]).length; const ts=Object.values(state).filter(x=>x&&x.doneAt).map(x=>x.doneAt).sort((a,b)=>a-b); list.push({ supplier:s.meta.supplier, done, total, isFinished:done===total&&total>0, durationMs:ts.length?ts[ts.length-1]-ts[0]:0, state }); });
    const finished = list.filter(s=>s.isFinished&&s.durationMs>0);
    const totalProducts = finished.reduce((a,s)=>a+s.done,0);
    const totalMinutes = finished.reduce((a,s)=>a+(s.durationMs/60000),0);
    const byOperator = {};
    finished.forEach(s=>Object.values(s.state).forEach(st=>{ if(st&&st.done&&st.doneBy) byOperator[st.doneBy]=(byOperator[st.doneBy]||0)+1; }));
    return { totalSessions:list.length, finishedSessions:finished.length, totalProducts, avgCadence: totalMinutes>0?(totalProducts/totalMinutes).toFixed(2):0, byOperator };
  }, [allSessions]);
  return (
    <>
      <div className="recap-card">
        <h3>📊 Vue d'ensemble</h3>
        <div className="recap-stat"><span className="label">Total sessions</span><span className="value">{stats.totalSessions}</span></div>
        <div className="recap-stat"><span className="label">Sessions terminées</span><span className="value">{stats.finishedSessions}</span></div>
        <div className="recap-stat"><span className="label">Produits dispatchés</span><span className="value">{stats.totalProducts}</span></div>
        <div className="recap-stat"><span className="label">Cadence moyenne</span><span className="value">{stats.avgCadence} prod/min</span></div>
      </div>
      {Object.keys(stats.byOperator).length>0 && (
        <div className="recap-card">
          <h3>👥 Par opérateur</h3>
          {Object.entries(stats.byOperator).sort((a,b)=>b[1]-a[1]).map(([n,c])=>(<div className="recap-stat" key={n}><span className="label">{n}</span><span className="value">{c} produits</span></div>))}
        </div>
      )}
    </>
  );
}

/* ---- Admin : détail d'une session ---- */
function AdminSessionDetail({ session, onClose }) {
  const s = session;
  const dateStr = s.startedAt ? new Date(s.startedAt).toLocaleString("fr-FR") : "";
  const products = s.products || [];
  const storeColumns = useMemo(() => (s.meta && Array.isArray(s.meta.storeColumns) && s.meta.storeColumns.length>0) ? s.meta.storeColumns : [{code:"ROB",label:"ROB",needsNaming:false},{code:"TOL",label:"TOL",needsNaming:false},{code:"PDP",label:"PDP",needsNaming:false}], [s.meta]);
  const pk = useMemo(() => products.map((p,idx)=>({...p,_pkey:productKey(p,idx)})), [products]);
  const getEQ = (p, code) => { const st=s.state[p._pkey]; if(st&&st.qtyStores&&st.qtyStores[code]!==undefined) return st.qtyStores[code]; return (p.stores&&p.stores[code])||0; };
  const notDone = pk.filter(p=>!(s.state[p._pkey]&&s.state[p._pkey].done));
  const ecarts = []; pk.forEach(p=>{ const st=s.state[p._pkey]; if(st&&st.ecarts&&st.ecarts.length) st.ecarts.forEach(e=>ecarts.push({...e, designation:p.designation})); });
  const handleDelete = () => { if(!confirm(`Supprimer la session "${s.supplier}" ?`)) return; if(firebaseReady) db.ref(`dispatch/${s.id}`).remove().then(()=>{ alert("Supprimée."); onClose(); }).catch(e=>alert("Erreur: "+e.message)); };
  return (
    <div className="app">
      <div className="header" style={{background:"#0d3d20"}}>
        <div className="header-row"><div><h1>{s.supplier}</h1><div className="sub">{dateStr}</div></div><div className="header-actions"><button className="header-btn" onClick={onClose}>← Retour</button></div></div>
      </div>
      <div style={{padding:12, paddingBottom:80}}>
        <div className="recap-card">
          <h3>Vue d'ensemble</h3>
          <div className="recap-stat"><span className="label">Créé par</span><span className="value">{s.createdBy||"?"}</span></div>
          <div className="recap-stat"><span className="label">Opérateurs</span><span className="value">{s.operators.join(", ")||"-"}</span></div>
          <div className="recap-stat"><span className="label">Avancement</span><span className="value">{s.done}/{s.total}</span></div>
          {s.durationMs>0 && <div className="recap-stat"><span className="label">Durée</span><span className="value">{fmtDuration(s.durationMs)}</span></div>}
        </div>
        {ecarts.length>0 && (
          <div className="recap-card">
            <h3>⚠️ Écarts ({ecarts.length})</h3>
            {ecarts.map((e,i)=>(<div className="anomaly-item red" key={i}><div className="product">{e.designation}</div><div className="detail">{e.storeLabel||e.store}: {e.planned}→{e.real} · {e.reason}{e.reasonText?` (${e.reasonText})`:""}</div></div>))}
          </div>
        )}
        {notDone.length>0 && (
          <div className="recap-card">
            <h3>⏳ Non traités ({notDone.length})</h3>
            {notDone.map(p=>(<div className="anomaly-item" key={p._pkey}><div className="product">{p.designation}</div><div className="detail">Reçu: {p.recue} • {storeColumns.map((sc,i)=><span key={sc.code}>{i>0?" / ":""}{sc.label} {(p.stores&&p.stores[sc.code])||0}</span>)}</div></div>))}
          </div>
        )}
        <div className="recap-card">
          <h3>📄 Générer les BL PDF</h3>
          {(() => {
            const activeStores = storeColumns.filter(sc=>{ let t=0; pk.forEach(p=>{ t+=getEQ(p, sc.code); }); return t>0; });
            return (<>
              <button className="btn-primary" onClick={()=>generateAllBLs(s, pk, storeColumns)} style={{marginBottom:8}}>📥 Tous les BL ({activeStores.length})</button>
              <div style={{display:"grid", gridTemplateColumns:`repeat(${Math.min(activeStores.length,3)},1fr)`, gap:6}}>{activeStores.map(sc=><button key={sc.code} className="btn-secondary" onClick={()=>generateBL(s, pk, sc.code, storeColumns)}>{sc.label}</button>)}</div>
            </>);
          })()}
        </div>
        <div className="recap-card" style={{border:"1.5px solid #d32f2f"}}>
          <h3 style={{color:"#d32f2f"}}>⚠️ Zone dangereuse</h3>
          <button className="btn-primary" onClick={handleDelete} style={{background:"#d32f2f"}}>🗑 Supprimer cette session</button>
        </div>
      </div>
    </div>
  );
}

// Agrégat complet d'un fromage : pièces pesées + éventuel lot "déjà en pièces" (sticker).
function frAggFull(product, st) {
  const a = frAgg(st);
  let kbgN=a.kbgN, kbgG=a.kbgG, robN=a.robN, robG=a.robG, total=a.total, robMeules=0;
  const w = product.poids||FROMAGE_DEFAULT_POIDS;
  // Déjà en pièces (sticker) : n pièces vers un magasin, poids ≈ n × poids cible.
  if (st && st.sticker) {
    const n = st.stickerCount||0;
    const g = (st.stickerWeight!=null && st.stickerWeight!=="") ? Number(st.stickerWeight) : (w*n);
    if ((st.magasin||"KBG")==="KBG") { kbgN+=n; kbgG+=g; } else { robN+=n; robG+=g; }
    total+=n;
  }
  // Robespierre / Montreuil : vendu AU POIDS → découpe en meules/colis (¼ ½ 1), pas de pesée.
  // On note la fraction de meule/colis découpée + le nb de morceaux. Kg approx = meules × poids d'une meule.
  if (st && st.rob) {
    const m = Number(st.rob.meules)||0, mc = Number(st.rob.morceaux)||0;
    const pu = (st.rob.poidsUnit!=null && st.rob.poidsUnit!=="") ? Number(st.rob.poidsUnit) : (Number(product.poidsUnit)||0); // kg / meule|colis entier
    // Poids total découpé saisi par l'opérateur (kg) → prioritaire ; sinon estimé meules × poids unitaire.
    const ptKg = (st.poidsDecoupe!=null && st.poidsDecoupe!=="") ? Number(st.poidsDecoupe) : 0;
    robMeules += m; robN += mc; robG += (ptKg>0 ? ptKg*1000 : m*pu*1000); total += (mc||(m>0?1:0)||(ptKg>0?1:0));
  }
  // Kelbongoo : poids total saisi (kg) pris en compte s'il n'y a pas eu de pesée pièce par pièce.
  if (st && !st.rob && (st.poidsDecoupe!=null && st.poidsDecoupe!=="") && kbgG===0 && !st.sticker) {
    kbgG += Number(st.poidsDecoupe)*1000;
  }
  return { kbgN, kbgG, robN, robG, total, robMeules };
}
// Rendement Kelbongoo (%) = poids parti KBG / poids total découpé.
const rendement = (kbgG, robG) => { const t=kbgG+robG; return t>0 ? Math.round(kbgG/t*100) : 0; };
// Bilan complet d'une session de découpe (utilisé pour le récap ET le suivi console via /recap).
function decoupeTotals(products, state) {
  let kbgN=0,kbgG=0,robN=0,robG=0,robMeules=0,done=0; const lines=[];
  (products||[]).forEach((p,idx)=>{ const st=(state&&state[productKey(p,idx)])||{}; const a=frAggFull(p,st);
    kbgN+=a.kbgN; kbgG+=a.kbgG; robN+=a.robN; robG+=a.robG; robMeules+=a.robMeules||0; if(st.done) done++;
    if (a.total>0 || st.reception) lines.push({ designation:p.designation, article:p.article, poids:p.poids, tol:p.tol, kbgTarget:p.kbgTarget, robCmd:p.robCmd, sticker:!!st.sticker,
      robMeules:a.robMeules||0, robUnit:(st.rob&&st.rob.unit)||"meule", reception:st.reception||"", ...a }); });
  return { kbgN, kbgG, robN, robG, robMeules, done, total:(products||[]).length, lines, rend:rendement(kbgG,robG) };
}
// Écrit un résumé lisible par la console dans decoupe/<sid>/recap.
function pushDecoupeRecap(sessionId, products, state, operator, entity) {
  if (!firebaseReady || !sessionId) return;
  const t = decoupeTotals(products, state);
  db.ref(`decoupe/${sessionId}/recap`).update({
    entity:entity||"", rendement:t.rend, kbgN:t.kbgN, kbgG:Math.round(t.kbgG), robN:t.robN, robG:Math.round(t.robG),
    robMeules:Math.round(t.robMeules*100)/100, done:t.done, total:t.total,
    lines:t.lines.map(l=>({ designation:l.designation, kbgN:l.kbgN, kbgTarget:l.kbgTarget||0, robN:l.robN, kbgG:Math.round(l.kbgG), robG:Math.round(l.robG), robMeules:Math.round((l.robMeules||0)*100)/100, robUnit:l.robUnit||"meule", sticker:!!l.sticker })),
    updatedAt:Date.now(), by:(operator&&(operator.name||("#"+operator.code)))||""
  }).catch(()=>{});
}

/* =========================================================================
   DÉCOUPE FROMAGE — écran de pesée d'un fromage
   ========================================================================= */
function CheeseWeigh({ product, pkey, status, operator, connected, onSetRow, onClose }) {
  const [w, setW] = useState("");
  const agg = frAgg(status);
  const { min, max } = frBounds(product);
  const weight = parseInt(w||"0", 10) || 0;
  const previewDest = weight>0 ? frRoute(product, weight, agg.kbgN) : null;
  const kbgLeft = Math.max(0, (product.kbgTarget||0) - agg.kbgN);
  const tap = (d) => setW(v => (v.length<4 ? v+d : v));
  const del = () => setW(v => v.slice(0,-1));
  const validate = () => {
    if (weight<=0) return;
    const dest = frRoute(product, weight, agg.kbgN);
    const pieces = [ ...((status&&status.pieces)||[]), { w:weight, dest, at:Date.now(), by:operator.name||("#"+operator.code) } ];
    onSetRow(pkey, { pieces });
    try { navigator.vibrate && navigator.vibrate(dest==="KBG"?60:[40,40,40]); } catch(e){}
    setW("");
  };
  const undo = () => {
    const pieces = [ ...((status&&status.pieces)||[]) ];
    if (!pieces.length) return;
    pieces.pop();
    onSetRow(pkey, { pieces });
  };
  const finish = () => {
    onSetRow(pkey, { done:true, doneBy:operator.name||("#"+operator.code), doneAt:Date.now() });
    onClose();
  };
  return (
    <div className="app">
      <div className="header fr-head" style={{background:"#8a5a00"}}>
        <div className="header-row">
          <div><h1 style={{fontSize:15}}>{product.designation}</h1>
            <div className="sub">cible {product.poids} g · tolérance ±{product.tol}% ({min}–{max} g) <span className={`conn-status ${!connected?"offline":""}`}>{connected?"● en ligne":"● hors ligne"}</span></div>
          </div>
          <div className="header-actions"><button className="header-btn" onClick={onClose}>← Retour</button></div>
        </div>
      </div>
      <div className="weigh-wrap">
        <div className="piece-tally">
          <div className="pt kbg">
            <div className="n">{agg.kbgN}{product.kbgTarget>0?`/${product.kbgTarget}`:""}</div>
            <div className="l">KELBONGOO · {Math.round(agg.kbgG)} g</div>
          </div>
          <div className="pt rob">
            <div className="n">{agg.robN}</div>
            <div className="l">ROBESPIERRE · {Math.round(agg.robG)} g</div>
          </div>
        </div>

        <div className="weigh-display">{w||"0"}<span className="weigh-unit"> g</span></div>
        <div className={`weigh-verdict ${previewDest?previewDest.toLowerCase():"none"}`}>
          {!previewDest ? "Pèse une pièce et tape son poids"
            : previewDest==="KBG" ? `✓ Dans la tolérance → KELBONGOO${kbgLeft>0?` (reste ${kbgLeft})`:""}`
            : (weight<min ? `⚖️ Trop léger → ROBESPIERRE` : weight>max ? `⚖️ Trop lourd → ROBESPIERRE` : kbgLeft===0 ? `Objectif Kelbongoo atteint → ROBESPIERRE` : `→ ROBESPIERRE`)}
        </div>

        <div className="keypad">
          {["1","2","3","4","5","6","7","8","9"].map(d=><button key={d} onClick={()=>tap(d)}>{d}</button>)}
          <button className="del" onClick={del}>⌫</button>
          <button onClick={()=>tap("0")}>0</button>
          <button className="act" onClick={validate} disabled={weight<=0}>✓ Pièce</button>
        </div>

        <div style={{display:"flex", gap:8, marginTop:14, maxWidth:420, marginLeft:"auto", marginRight:"auto"}}>
          <button className="btn-undo" style={{flex:1}} onClick={undo} disabled={agg.total===0}>↶ Annuler dernière pièce</button>
          <button className="btn-validate" style={{flex:1, background:"#2e7d32"}} onClick={finish}>✓ Terminer ce fromage</button>
        </div>

        {agg.total>0 && (
          <div className="recap-card" style={{marginTop:16}}>
            <h3>Pièces coupées ({agg.total})</h3>
            <div className="piece-log">
              {[ ...((status&&status.pieces)||[]) ].reverse().map((pc,i)=>(
                <div className="pl" key={i}><span>{pc.w} g</span><span className={`pd ${pc.dest.toLowerCase()}`}>{pc.dest==="KBG"?"Kelbongoo":"Robespierre"}</span></div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

                    : <button className="btn-undo" style={{width:"100%", marginTop:8}} onClick={()=>setRow(p._pkey,{done:false, doneBy:null, doneAt:null})}>Annuler « terminé »</button>}

          </div>
          <div className="bottom-bar">
            <div className="stats"><span>Avancement: <b>{stats.done}/{stats.total}</b></span><span>{stats.total>0?Math.round((stats.done/stats.total)*100):0}%</span></div>
            <button className="btn-finish" onClick={()=>{ if(stats.done===stats.total && stats.total>0) launchConfetti(); onFinish(state, list); }} disabled={stats.done===0} style={{background:"#8a5a00"}}>{stats.done===stats.total&&stats.total>0?"✓ Terminer et voir le bilan":`Voir le bilan (${stats.done} faits)`}</button>
          </div>
        </>
      )}
    </div>
  );
}

function generateFromageBL(supplier, products, state, entity) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const entLabel = entity==="KBG" ? "KELBONGOO (Pantin)" : "PRIBON ROBESPIERRE";
  doc.setFillColor(138,90,0); doc.rect(0,0,210,25,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,"bold"); doc.text("LA CENTRALE PDP", 14, 12);
  doc.setFontSize(11); doc.setFont(undefined,"normal"); doc.text("Découpe fromage — Bon de livraison", 14, 19);
  doc.setFontSize(16); doc.setFont(undefined,"bold"); doc.text(entLabel, 196, 15, { align:"right" });
  doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont(undefined,"normal");
  let y=35; doc.text("Fournisseur : "+(supplier||"-"), 14, y); y+=6;
  doc.text("Date : "+new Date().toLocaleDateString("fr-FR"), 14, y); y+=8;
  const rows = [];
  products.forEach((p,idx) => {
    const st = state[productKey(p,idx)]||{}; const agg = frAggFull(p, st);
    if (entity==="KBG") { if (agg.kbgN>0) rows.push([ p.designation, String(agg.kbgN), Math.round(agg.kbgG)+" g" ]); }
    else { // Robespierre : meules/colis + morceaux + kg approx
      if (agg.robN>0 || agg.robMeules>0) { const unit=(st.rob&&st.rob.unit)||"meule"; const kg=agg.robG>0?(Math.round(agg.robG/1000*10)/10+" kg"):"—";
        rows.push([ p.designation, (agg.robMeules||0)+" "+(unit==="meule"?"meule(s)":"colis"), String(agg.robN||0), kg ]); }
    }
  });
  if (entity==="KBG") {
    doc.autoTable({ startY:y, head:[["Fromage","Pièces","Poids total"]], body:rows,
      headStyles:{ fillColor:[138,90,0], textColor:255, fontStyle:"bold" }, styles:{ fontSize:9, cellPadding:2 },
      columnStyles:{ 0:{cellWidth:120}, 1:{cellWidth:30, halign:"center"}, 2:{cellWidth:32, halign:"center"} }, margin:{left:14,right:14} });
    const totN = rows.reduce((s,r)=>s+parseInt(r[1],10),0);
    const fy = doc.lastAutoTable.finalY+6; doc.setFont(undefined,"bold");
    doc.text(`TOTAL : ${rows.length} fromage(s) — ${totN} pièce(s)`, 14, fy);
  } else {
    doc.autoTable({ startY:y, head:[["Fromage","Découpé","Morceaux","Poids approx."]], body:rows,
      headStyles:{ fillColor:[106,27,154], textColor:255, fontStyle:"bold" }, styles:{ fontSize:9, cellPadding:2 },
      columnStyles:{ 0:{cellWidth:100}, 1:{cellWidth:34, halign:"center"}, 2:{cellWidth:26, halign:"center"}, 3:{cellWidth:26, halign:"center"} }, margin:{left:14,right:14} });
    const totN = rows.reduce((s,r)=>s+parseInt(r[2],10),0);
    const fy = doc.lastAutoTable.finalY+6; doc.setFont(undefined,"bold");
    doc.text(`TOTAL : ${rows.length} fromage(s) — ${totN} morceau(x)`, 14, fy);
  }
  doc.save(`Decoupe_${entity}_${(supplier||"").replace(/[^a-zA-Z0-9]/g,"")}_${new Date().toISOString().slice(0,10)}.pdf`);
}
function DecoupeRecap({ sessionId, operator, supplier, entity, products, state, onClose, onLeave }) {
  const [sent, setSent] = useState(false); const [sending, setSending] = useState(false); const [error, setError] = useState("");
  const isRob = (entity||"").toUpperCase()==="ROB";
  const totals = useMemo(() => decoupeTotals(products, state), [products, state]);
  const kgApprox = totals.robG>0 ? Math.round(totals.robG/1000*10)/10 : 0;
  const bravo = totals.rend>=FROMAGE_RENDEMENT_OK;

/* =========================================================================
   ADMIN — chargement d'une découpe fromage
   ========================================================================= */
function AdminLoadFromage({ onSessionStart }) {
  const [supplierName, setSupplierName] = useState("");
  const [poids, setPoids] = useState(String(FROMAGE_DEFAULT_POIDS));
  const [tol, setTol] = useState(String(FROMAGE_DEFAULT_TOL));
  const [pending, setPending] = useState(null);
  const [error, setError] = useState("");
  const [sent, setSent] = useState(false);
  const fileRef = useRef(null);
  const processFile = async (file) => {
    setError(""); if (!file) return;
    try {
      const buf = await file.arrayBuffer(); const wb = XLSX.read(buf, { type:"array" });
      const { products, hasRob, hasKbg } = parseFromageFile(wb);
      const P = parseInt(poids,10)||FROMAGE_DEFAULT_POIDS, T = parseInt(tol,10)||FROMAGE_DEFAULT_TOL;
      const prods = products.map(p => ({ ...p, poids:p.poids||P, tol:T }));
      setPending({ products:prods, hasRob, hasKbg, fileName:file.name||"decoupe" });
    } catch(e){ setError("Erreur de lecture : "+e.message); setPending(null); }
  };
  const sendDecoupe = () => {
    if (!pending) { setError("Charge d'abord le fichier de découpe."); return; }
    const supplier = supplierName.trim() || "Découpe";
    setSent(true); launchConfetti();
    const sid = `decoupe_${stripAccents(supplier).replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()}_${Date.now()}`;
    onSessionStart(sid, supplier, pending.products);
  };
  return (
    <>
      <div className="recap-card">
        <h3>🧀 Charger une découpe fromage</h3>
        <div className="field"><label>Fournisseur / lot</label>
          <input type="text" value={supplierName} onChange={e=>setSupplierName(e.target.value)} placeholder="Ex: LAITERIE X" style={{textTransform:"uppercase"}} disabled={!!pending} /></div>
        <div style={{display:"flex", gap:8}}>
          <div className="field" style={{flex:1}}><label>Poids pièce Kelbongoo (g)</label>
            <input type="number" value={poids} onChange={e=>setPoids(e.target.value)} disabled={!!pending} /></div>
          <div className="field" style={{flex:1}}><label>Tolérance ± %</label>
            <input type="number" value={tol} onChange={e=>setTol(e.target.value)} disabled={!!pending} /></div>
        </div>
        {!pending && (
          <div className="upload-zone" onClick={()=>fileRef.current&&fileRef.current.click()}>
            <div className="icon">🧀</div>
            <div className="label">Charger le fichier de découpe (Excel)</div>
            <div className="hint">colonnes Robespierre / Kelbongoo (+ poids optionnel)</div>
          </div>
        )}
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>processFile(e.target.files[0])} />
        {pending && (
          <div style={{background:"#fff8e1", border:"1.5px solid #ffe082", borderRadius:8, padding:12, marginTop:4}}>
            <div style={{fontWeight:700, color:"#8a5a00"}}>✓ Fichier prêt : {pending.fileName}</div>
            <div style={{fontSize:13, color:"#333", marginTop:4}}>{pending.products.length} fromage(s) · {pending.hasRob?"colonne Robespierre ✓":"⚠ pas de colonne Robespierre"} · {pending.hasKbg?"colonne Kelbongoo ✓":"⚠ pas de colonne Kelbongoo"}</div>
            <div style={{fontSize:12, color:"#666", marginTop:4}}>Pièce Kelbongoo cible : {parseInt(poids,10)||FROMAGE_DEFAULT_POIDS} g · ±{parseInt(tol,10)||FROMAGE_DEFAULT_TOL}%</div>
            <button className="btn-secondary" onClick={()=>{ setPending(null); setSent(false); if(fileRef.current)fileRef.current.value=""; }} style={{marginTop:8, fontSize:13}}>↺ Changer de fichier</button>
          </div>
        )}
        {error && <div style={{color:"#d32f2f", fontSize:13, marginTop:12}}>{error}</div>}
      </div>
      <div className="recap-card" style={{border:"1.5px solid #8a5a00"}}>
        <h3>🚀 Lancer la découpe</h3>
        <button className="btn-primary" onClick={sendDecoupe} disabled={!pending||sent} style={{background:(!pending||sent)?"#aaa":"#ef8f00", fontSize:17}}>{sent?"🎉 Découpe lancée !":"🚀 Lancer la découpe"}</button>
      </div>
    </>
  );
}

// Résumé (nb de références + total bouteilles) d'un inventaire.
function vinSummary(v) {
  const L = Object.values((v && v.lines) || {});
  let units = 0, refs = 0;
  L.forEach(l => { const u = (l.units!=null ? l.units : ((l.cartons||0)*CARTON_VIN + (l.bottles||0))); if (u>0) refs++; units += u; });
  return { refs, units };
}

function InventaireVinScreen({ invId, inv, operator, onLeave }) {
  const [localInv, setLocalInv] = useState(inv || {meta:{}, lines:{}});
  const data  = firebaseReady ? (inv || {meta:{}, lines:{}}) : localInv;
  const lines = data.lines || {};
  const meta  = data.meta  || {};
  const [scan, setScan] = useState("");
  const [activeKey, setActiveKey] = useState(null);
  const [scanMode, setScanMode] = useState("bottle"); // bottle = 1 scan +1 bouteille ; select = sélection pour saisie
  const [showCam, setShowCam] = useState(false);
  const [toast, setToast] = useState("");
  const scanRef = useRef(null);
  const focusScan = () => { setTimeout(()=>{ if (scanRef.current) scanRef.current.focus(); }, 30); };
  useEffect(()=>{ focusScan(); }, []);
  const flash = (m) => { setToast(m); setTimeout(()=>setToast(""), 1100); };
  const opBy = operator.name || ("Code " + operator.code);

  // Écriture d'une ligne (saisie manuelle / désignation).
  const writeLine = (key, patch) => {
    const cur  = lines[key] || {};
    const next = Object.assign({}, cur, patch);
    next.units = (Number(next.cartons)||0)*CARTON_VIN + (Number(next.bottles)||0);
    next.updatedAt = Date.now();
    if (cur.createdAt == null) next.createdAt = Date.now();
    next.by = opBy;
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/lines/${key}`).update(next);
    else setLocalInv(d => ({ ...d, lines: { ...(d.lines||{}), [key]: Object.assign({}, (d.lines||{})[key], next) } }));
  };
  const removeLine = (key) => {
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/lines/${key}`).remove();
    else setLocalInv(d => { const l = {...(d.lines||{})}; delete l[key]; return {...d, lines:l}; });
    if (activeKey === key) setActiveKey(null);
    focusScan();
  };

  const commitScan = (raw) => {
    const ean = digitsOnly(raw);
    if (ean.length < 4) { setScan(""); focusScan(); return; }
    const key = vinLineKey(ean);
    if (scanMode === "bottle") {
      // Incrément atomique (évite de perdre des scans rapides).
      if (firebaseReady) {
        db.ref(`inventaire_vin/${invId}/lines/${key}`).transaction(cur => {
          cur = cur || { ean, cartons:0, bottles:0, createdAt:Date.now() };
          cur.ean = ean;
          cur.cartons = Number(cur.cartons)||0;
          cur.bottles = (Number(cur.bottles)||0) + 1;
          cur.units = cur.cartons*CARTON_VIN + cur.bottles;
          cur.updatedAt = Date.now(); cur.by = opBy;
          return cur;
        });
      } else {
        setLocalInv(d => {
          const l = {...(d.lines||{})}; const c = l[key] || { ean, cartons:0, bottles:0, createdAt:Date.now() };
          const b = (Number(c.bottles)||0)+1; const ca = Number(c.cartons)||0;
          l[key] = Object.assign({}, c, { ean, bottles:b, cartons:ca, units:ca*CARTON_VIN+b, updatedAt:Date.now(), by:opBy });
          return {...d, lines:l};
        });
      }
      flash("🍾 +1 bouteille");
    } else {
      if (!lines[key]) writeLine(key, { ean, bottles:0, cartons:0 });
      flash("Sélectionné");
    }
    setActiveKey(key);
    setScan(""); focusScan();
    try { navigator.vibrate && navigator.vibrate(40); } catch(e){}
  };

  const setQty = (key, field, val) => writeLine(key, { [field]: Math.max(0, Math.floor(Number(val)||0)) });
  const bump   = (key, field, delta) => {
    const cur = lines[key] || {}; writeLine(key, { [field]: Math.max(0, (Number(cur[field])||0)+delta) }); focusScan();
  };

  const arr = Object.entries(lines).map(([k,l])=>Object.assign({key:k}, l))
    .sort((a,b)=>((a.createdAt||0)-(b.createdAt||0)));
  const uOf = (l) => (l.units!=null ? l.units : ((l.cartons||0)*CARTON_VIN + (l.bottles||0)));
  const totalUnits = arr.reduce((s,l)=>s+uOf(l), 0);
  const refs = arr.filter(l=>uOf(l)>0).length;
  const active = activeKey ? lines[activeKey] : null;

  const cloturer = () => {
    if (!confirm("Clôturer cet inventaire ?\n\nLa validation et la génération du .txt (pour PROGMAG) se font ensuite dans la console responsable.")) return;
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta/closed`).set(true);
    else setLocalInv(d => ({ ...d, meta:{ ...(d.meta||{}), closed:true } }));
    onLeave();
  };
  const rename = () => {
    const n = prompt("Nom de l'inventaire :", meta.label || "Inventaire vin");
    if (n == null) return;
    const lab = n.trim() || "Inventaire vin";
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta/label`).set(lab);
    else setLocalInv(d => ({ ...d, meta:{ ...(d.meta||{}), label:lab } }));
  };

  return (
    <div className="app">
      <div className="header" style={{background:"#7b1e3a"}}>
        <div className="header-row">
          <div><h1 onClick={rename} style={{cursor:"pointer"}}>🍷 {meta.label||"Inventaire vin"} ✎</h1><div className="sub">{refs} réf. · {totalUnits} bouteille(s)</div></div>
          <div className="header-actions"><button className="header-btn" onClick={onLeave}>← Retour</button></div>
        </div>
      </div>

      <div style={{padding:14, paddingBottom:130}}>
        {!firebaseReady && <div className="admin-note" style={{color:"#c62828"}}>⚠️ Hors-ligne : l'inventaire ne sera pas synchronisé avec la console.</div>}

        <div style={{display:"flex", gap:8, marginBottom:10}}>
          <button onClick={()=>{setScanMode("bottle");focusScan();}} style={{flex:1, padding:10, borderRadius:8, fontWeight:800, fontSize:13, border:"1.5px solid #7b1e3a", background:scanMode==="bottle"?"#7b1e3a":"#fff", color:scanMode==="bottle"?"#fff":"#7b1e3a"}}>1 scan = 1 bouteille</button>
          <button onClick={()=>{setScanMode("select");focusScan();}} style={{flex:1, padding:10, borderRadius:8, fontWeight:800, fontSize:13, border:"1.5px solid #7b1e3a", background:scanMode==="select"?"#7b1e3a":"#fff", color:scanMode==="select"?"#fff":"#7b1e3a"}}>Saisie manuelle</button>
        </div>

        <div className="scan-search-wrap">
          <input ref={scanRef} className="scan-search-input" style={{borderColor:"#7b1e3a"}} type="text" inputMode="numeric"
            placeholder="Scanne un code-barres…" value={scan}
            onChange={e=>setScan(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); commitScan(scan); } }} autoFocus />
        </div>
        <div style={{display:"flex", gap:8, marginBottom:14}}>
          <button className="btn-secondary" style={{flex:1}} onClick={()=>setShowCam(true)}>📷 Caméra</button>
          <button className="btn-secondary" style={{flex:1}} onClick={()=>commitScan(scan)} disabled={!scan}>Ajouter</button>
        </div>

        {active && (
          <div className="card" style={{maxWidth:"none", marginBottom:14, border:"2px solid #7b1e3a"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
              <div style={{fontFamily:"monospace", fontWeight:800, fontSize:16}}>{active.ean}</div>
              <button onClick={()=>removeLine(activeKey)} style={{background:"#fdecea", color:"#c62828", borderRadius:6, padding:"4px 10px", fontWeight:700, fontSize:13}}>🗑 Supprimer</button>
            </div>
            <input type="text" value={active.designation||""} placeholder="Désignation (optionnel)"
              onChange={e=>writeLine(activeKey,{designation:e.target.value})} onBlur={focusScan}
              style={{width:"100%", padding:10, border:"1.5px solid #ddd", borderRadius:8, marginBottom:12, fontSize:14}} />
            <div style={{display:"flex", gap:10, marginBottom:10}}>
              <QtyBox label="Cartons (×6)" val={active.cartons||0} onDelta={d=>bump(activeKey,"cartons",d)} onSet={v=>setQty(activeKey,"cartons",v)} onBlur={focusScan} color="#7b1e3a" />
              <QtyBox label="Bouteilles" val={active.bottles||0} onDelta={d=>bump(activeKey,"bottles",d)} onSet={v=>setQty(activeKey,"bottles",v)} onBlur={focusScan} color="#e65100" />
            </div>
            <div style={{textAlign:"center", fontSize:16, fontWeight:800, color:"#1a4d2e", background:"#e8f5e9", borderRadius:8, padding:"10px 0"}}>
              = {(Number(active.cartons)||0)*CARTON_VIN + (Number(active.bottles)||0)} bouteille(s)
            </div>
          </div>
        )}

        <h3 style={{fontSize:14, color:"#555", margin:"8px 4px"}}>Lignes ({arr.length})</h3>
        {arr.length===0 && <div className="admin-note">Scanne un premier code-barres pour commencer.</div>}
        {arr.slice().reverse().map(l=>{
          const un = uOf(l); const isA = l.key===activeKey;
          return (
            <div key={l.key} onClick={()=>{ setActiveKey(l.key); focusScan(); }}
              style={{background:isA?"#fbe9ee":"#fff", border:"1.5px solid "+(isA?"#7b1e3a":"#e6e8ec"), borderRadius:10, padding:"10px 12px", marginBottom:8, cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", gap:10}}>
              <div style={{minWidth:0}}>
                <div style={{fontFamily:"monospace", fontWeight:700, fontSize:14}}>{l.ean}</div>
                <div style={{fontSize:12, color:"#777", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{l.designation||""}{(l.cartons||0)>0?` · ${l.cartons} carton(s)`:""}{(l.bottles||0)>0?` · ${l.bottles} vrac`:""}</div>
              </div>
              <div style={{fontWeight:900, fontSize:18, color:"#7b1e3a", whiteSpace:"nowrap"}}>{un}</div>
            </div>
          );
        })}
      </div>

      <div className="bottom-bar">
        <div className="stats"><span>{refs} référence(s)</span><span>Total : <b>{totalUnits}</b> bouteille(s)</span></div>
        <button className="btn-finish" style={{background:"#7b1e3a"}} onClick={cloturer}>✓ Clôturer l'inventaire</button>
      </div>

      {toast && <div className="toast">{toast}</div>}
      {showCam && <CameraScanner onDetect={(code)=>{ setShowCam(false); commitScan(code); }} onClose={()=>{ setShowCam(false); focusScan(); }} />}
    </div>
  );
}

/* =========================================================================
   APP ROOT
   ========================================================================= */
function App() {
  // Module courant : null (menu) | dispatch | decoupe | vin | reception | admin
  const [module, setModule] = useState(null);
  // Opérateur (login par code) — partagé entre modules, persistant.
  const [operator, setOperator] = useState(() => {
    const c = localStorage.getItem("centrale_op_code")||"";
    const at = parseInt(localStorage.getItem("centrale_op_at")||"0", 10);
    if (!c) return null;
    if (!at || (Date.now()-at) > CODE_SESSION_TTL_MS) { // session expirée -> reconnexion
      ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>localStorage.removeItem(k));
      return null;
    }
    return { code:c, name: localStorage.getItem("centrale_op_name")||"" };
  });
  // Plus de connexion admin dans l'app : l'identité = uniquement le code opérateur.
  // On purge l'ancienne clé qui provoquait une "connexion" fantôme (ex. hg@probon.fr).
  const adminEmail = "";
  useEffect(() => { try { localStorage.removeItem("centrale_admin_email"); } catch(e){} }, []);
  const logout = () => {
    ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
    setOperator(null); setModule(null);
  };

  // ----- État module DISPATCH -----
  const [sessionId, setSessionId] = useState(localStorage.getItem("dispatch_sessionId")||"");
  const [supplier, setSupplier] = useState(localStorage.getItem("dispatch_supplier")||"");
  const [products, setProducts] = useState(() => { try { return JSON.parse(localStorage.getItem("dispatch_products")||"[]"); } catch { return []; } });
  const [storeColumns, setStoreColumns] = useState(() => { try { return JSON.parse(localStorage.getItem("dispatch_storeColumns")||"[]"); } catch { return []; } });
  const [dView, setDView] = useState("home"); // home | dispatch | recap | palette | naming
  const [recapData, setRecapData] = useState(null);
  const [namingData, setNamingData] = useState(null);
  const [paletteStore, setPaletteStore] = useState(null);

  // ----- État module DÉCOUPE -----
  const [decSessionId, setDecSessionId] = useState("");
  const [decSupplier, setDecSupplier] = useState("");
  const [decProducts, setDecProducts] = useState([]);
  const [decEntity, setDecEntity] = useState("");   // KBG | ROB (poussé par la console)
  const [decView, setDecView] = useState("home"); // home | decoupe | recap
  const [decRecapData, setDecRecapData] = useState(null);

  // ----- État module INVENTAIRE VIN -----
  const [vinInvId, setVinInvId] = useState("");
  const [vinView, setVinView] = useState("home"); // home | inv

  // ----- État module ADMIN -----
  const [adminView, setAdminView] = useState("screen"); // screen | session
  const [adminViewingSession, setAdminViewingSession] = useState(null);

  const allSessions = useAllSessions();
  const allDecoupe = useAllDecoupe();
  const allVin = useInventaireVin();

  // Forçage de MAJ : au démarrage + toutes les 10 min.
  useEffect(() => { centraleCheckVersion(); const t=setInterval(centraleCheckVersion, 10*60*1000); return ()=>clearInterval(t); }, []);
  // Expiration de session code (1 h) : déconnexion automatique -> reconnexion obligatoire.
  useEffect(() => {
    const check = () => {
      const at = parseInt(localStorage.getItem("centrale_op_at")||"0", 10);
      if (operator && (!at || (Date.now()-at) > CODE_SESSION_TTL_MS)) {
        ["centrale_op_code","centrale_op_name","centrale_op_at"].forEach(k=>localStorage.removeItem(k));
        setOperator(null);
      }
    };
    const t = setInterval(check, 30*1000); return () => clearInterval(t);
  }, [operator]);
  // Messages entrepôt (broadcasts poussés par la console) -> bannière.
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("broadcasts"); const h = (snap)=>renderBroadcastBanner(snap.val()||{});
    ref.on("value", h); return () => ref.off("value", h);
  }, []);
  // Suit le module courant pour filtrer la bannière (dispatch / découpe).
  useEffect(() => { window.__centraleModule = module; renderBroadcastBanner(__lastBcast); }, [module]);

  // Chaîne d'affichage de l'opérateur (les composants dispatch attendent une chaîne).
  const opObj = operator || { code:"", name:"Opérateur" };
  const opName = operatorDisplay(opObj.code||"", opObj.name||"");

  useEffect(() => {
    if (sessionId) localStorage.setItem("dispatch_sessionId", sessionId);
    if (supplier) localStorage.setItem("dispatch_supplier", supplier);
    if (products.length>0) localStorage.setItem("dispatch_products", JSON.stringify(products));
    if (storeColumns.length>0) localStorage.setItem("dispatch_storeColumns", JSON.stringify(storeColumns));
  }, [sessionId, supplier, products, storeColumns]);

  /* ---- DISPATCH ---- */
  const handleSessionStart = (sid, sup, prods, cols) => {
    setSessionId(sid); setSupplier(sup); setProducts(prods); setStoreColumns(cols||[]);
    setModule("dispatch"); setDView("dispatch");
    if (firebaseReady) db.ref(`dispatch/${sid}/meta`).set({ supplier:sup, startedAt:Date.now(), products:prods, storeColumns:cols||[], createdBy:opName });
    try { fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ action:"log-dispatch-start", sessionId:sid, supplier:sup, operator:opName, operatorCode:opObj.code, total:prods.length, startedAt:new Date().toISOString(), brand:BRAND }) }).catch(()=>{}); } catch(e){}
  };
  const handleJoinSession = (sid) => {
    if (!firebaseReady) return;
    db.ref(`dispatch/${sid}/meta`).once("value").then(snap => { const m=snap.val(); if(m){ setSessionId(sid); setSupplier(m.supplier||"Fournisseur"); setProducts(m.products||[]); setStoreColumns(m.storeColumns||[]); setDView("dispatch"); } });
  };
  const handleNeedsNaming = (data) => { setNamingData(data); setModule("dispatch"); setDView("naming"); };
  const handleNamingConfirm = (fp, fc) => { if(!namingData) return; const sup=namingData.supplier; const sid=`${stripAccents(sup).replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()}_${Date.now()}`; setNamingData(null); handleSessionStart(sid, sup, fp, fc); };
  const handleFinish = (state, pk) => { setRecapData({ state, products:pk }); setDView("recap"); };
  const handleLeaveSession = () => {
    ["dispatch_sessionId","dispatch_supplier","dispatch_products","dispatch_storeColumns"].forEach(k=>localStorage.removeItem(k));
    setSessionId(""); setSupplier(""); setProducts([]); setStoreColumns([]); setRecapData(null); setDView("home");
  };

  /* ---- DÉCOUPE ---- */
  const handleDecoupeStart = (sid, sup, prods) => {
    setDecSessionId(sid); setDecSupplier(sup); setDecProducts(prods); setModule("decoupe"); setDecView("decoupe");
    if (firebaseReady) db.ref(`decoupe/${sid}/meta`).set({ supplier:sup, startedAt:Date.now(), products:prods, createdBy:opName });
    try { fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({ action:"log-decoupe-start", sessionId:sid, supplier:sup, operator:opName, operatorCode:opObj.code, total:prods.length, startedAt:new Date().toISOString(), brand:BRAND }) }).catch(()=>{}); } catch(e){}
  };
  const handleDecoupeJoin = (sid) => {
    if (!firebaseReady) return;
    db.ref(`decoupe/${sid}/meta`).once("value").then(snap => { const m=snap.val(); if(m){ setDecSessionId(sid); setDecSupplier(m.supplier||"Découpe"); setDecProducts(m.products||[]); setDecEntity(m.entity||""); setDecView("decoupe"); } });
  };
  const handleDecoupeFinish = (state, pk) => { setDecRecapData({ state, products:pk }); setDecView("recap"); };
  const handleDecoupeLeave = () => { setDecSessionId(""); setDecSupplier(""); setDecProducts([]); setDecEntity(""); setDecRecapData(null); setDecView("home"); };

  /* ---- INVENTAIRE VIN ---- */
  const handleVinStart = () => {
    const invId = `vin_${Date.now()}`;
    const metaObj = { label:"Inventaire vin", startedAt:Date.now(), dateKey:todayKey(), createdBy:opName, operatorCode:opObj.code };
    if (firebaseReady) db.ref(`inventaire_vin/${invId}/meta`).set(metaObj);
    setVinInvId(invId); setVinView("inv"); setModule("vin");
  };
  const handleVinJoin = (invId) => { setVinInvId(invId); setVinView("inv"); };
  const handleVinLeave = () => { setVinInvId(""); setVinView("home"); };

  /* ---- Divers ---- */
  const handleResetCache = () => {
    if (!confirm("Vider le cache de l'app sur CET appareil ?\n(Ne supprime pas les données Firebase partagées.)")) return;
    Object.keys(localStorage).filter(k=>k.startsWith("dispatch_")&&k!=="centrale_op_code"&&k!=="centrale_op_name").forEach(k=>localStorage.removeItem(k));
    setSessionId(""); setSupplier(""); setProducts([]); setStoreColumns([]); setRecapData(null); setDView("home");
    setTimeout(()=>window.location.reload(), 100);
  };
  const pickModule = (m) => {
    if (m==="reception") { try { window.open(RECEPTION_URL, "_blank"); } catch(e){ location.href = RECEPTION_URL; } return; }
    setModule(m);
  };

  // ===== LANDING =====
  if (module===null) return <ModuleSelect onPick={pickModule} onResetCache={handleResetCache} operator={operator} onLogout={logout} />;

  // ===== ADMIN = accès à la CONSOLE DE CHARGEMENT (gestion) =====
  if (module==="admin") return <AdminConsoleScreen onBack={()=>setModule(null)} />;

  // ===== DISPATCH PALETTE =====
  if (module==="dispatch") {
    if (!operator) return <CodeLoginScreen moduleLabel="Dispatch palette" moduleKey="dispatch" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (dView==="naming" && namingData) return <NamingScreen supplier={namingData.supplier} products={namingData.products} storeColumns={namingData.storeColumns} onConfirm={handleNamingConfirm} onCancel={()=>{ setNamingData(null); setDView("home"); }} />;
    if (dView==="palette" && paletteStore) return <PaletteDetailScreen storeCode={paletteStore} allSessions={allSessions} adminEmail={true} onClose={()=>{ setPaletteStore(null); setDView("home"); }} />;
    if (dView==="recap" && recapData) return <RecapScreen sessionId={sessionId} operator={opName} supplier={supplier} products={recapData.products} storeColumns={storeColumns} state={recapData.state} onClose={()=>setDView("dispatch")} onLeave={handleLeaveSession} />;
    if (dView==="dispatch" && sessionId && products.length>0) return <DispatchScreen sessionId={sessionId} operator={opName} supplier={supplier} products={products} storeColumns={storeColumns} onFinish={handleFinish} onLeave={handleLeaveSession} />;
    return <HomeScreen operator={opName} allSessions={allSessions} adminEmail={false} onJoinSession={handleJoinSession} onOpenPalette={(code)=>{ setPaletteStore(code); setDView("palette"); }} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  // ===== INVENTAIRE VIN =====
  if (module==="vin") {
    if (!operator) return <CodeLoginScreen moduleLabel="Inventaire vin" moduleKey="vin" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (vinView==="inv" && vinInvId) return <InventaireVinScreen invId={vinInvId} inv={allVin[vinInvId]} operator={opObj} onLeave={handleVinLeave} />;
    return <InventaireVinHome operator={opObj} allVin={allVin} onNew={handleVinStart} onJoin={handleVinJoin} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  // ===== DÉCOUPE FROMAGE =====
  if (module==="decoupe") {
    if (!operator) return <CodeLoginScreen moduleLabel="Découpe fromage" moduleKey="decoupe" onLogin={(op)=>setOperator(op)} onBack={()=>setModule(null)} />;
    if (decView==="recap" && decRecapData) return <DecoupeRecap sessionId={decSessionId} operator={opObj} supplier={decSupplier} entity={decEntity} products={decRecapData.products} state={decRecapData.state} onClose={()=>setDecView("decoupe")} onLeave={handleDecoupeLeave} />;
    if (decView==="decoupe" && decSessionId && decProducts.length>0) return <DecoupeScreen sessionId={decSessionId} operator={opObj} supplier={decSupplier} products={decProducts} onFinish={handleDecoupeFinish} onLeave={handleDecoupeLeave} />;
    return <DecoupeHome operator={opObj} allDecoupe={allDecoupe} onJoin={handleDecoupeJoin} onBack={()=>setModule(null)} onLogout={logout} />;
  }

  return <ModuleSelect onPick={pickModule} onResetCache={handleResetCache} operator={operator} onLogout={logout} />;
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  console.error("Rendu impossible", e);
  if (window.showBootError) window.showBootError("Erreur au démarrage de l'application.");
}
</script>
</body>
</html>
