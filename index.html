<style>

const pad2 = (n) => n.toString().padStart(2, "0");
const fmtTime = (ts) => { if (!ts) return ""; return new Date(ts).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit", second:"2-digit" }); };
const fmtDuration = (ms) => {
  const s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60);

const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };

const addDaysISO = (iso, n) => { const d = iso ? new Date(iso+"T00:00:00") : new Date(); if(isNaN(d)) return ""; d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const daysBetweenISO = (aIso, bIso) => { const a=new Date((aIso||todayKey())+"T00:00:00"), b=new Date((bIso||todayKey())+"T00:00:00"); if(isNaN(a)||isNaN(b)) return null; return Math.round((b-a)/86400000); };

// Contrôle DLC pour une DLC réelle (iso) au jour de découpe (iso, défaut aujourd'hui).
function dlcControl(realIso, cutIso){
  const cut = cutIso || todayKey();
  const eti = addDaysISO(cut, DECOUPE_ETIQ_JOURS);       // DLC que la balance imprimerait (J+30)
  if(!realIso) return { eti, write:eti, handwrite:false, daysLeft:null, short:false };
  const realBeforeEti = daysBetweenISO(realIso, eti) > 0; // eti après la DLC réelle -> réelle plus proche
  const daysLeft = daysBetweenISO(cut, realIso);
  return { eti, write: realBeforeEti ? realIso : eti, handwrite: realBeforeEti, daysLeft, short: (daysLeft!=null && daysLeft < DLC_ALERTE_JOURS) };
}

// Recherche tolérante : multi-mots, sans accents, pluriel souple.
// "yaourt nature" trouve "Yaourts nature bio".
const smartMatch = (haystack, query) => {
  const h = stripAccents((haystack||"").toLowerCase());
  const tokens = stripAccents((query||"").toLowerCase()).split(/[\s,]+/).filter(Boolean);
  if (!tokens.length) return true;
  return tokens.every(t => {
    if (h.includes(t)) return true;
    const sing = t.replace(/(aux|eaux|s|x)$/,"");
    return sing.length >= 3 && h.includes(sing);

};

const digitsOnly = (s) => (s||"").toString().replace(/\D/g,"");
const trimZeros = (s) => s.replace(/^0+/,"") || s;
const barcodeMatch = (article, code) => {
  const a = digitsOnly(article), q = digitsOnly(code);
  if (!a || !q) return false;
  if (a === q) return true;
  if (a.includes(q)) return true;                     // le code scanné figure dans le champ article
  const az = trimZeros(a), qz = trimZeros(q);
  if (az === qz) return true;                         // tolérance zéros de tête
  if (az.includes(qz) && qz.length >= 8) return true; // code long contenu (EAN)
  if (qz.includes(az) && az.length >= 8) return true;
  return false;
};

// (Inventaire vin : accès réutilisé du dispatch — mêmes opérateurs entrepôt. Changer la colonne si un registre dédié est créé.)
async function verifyCentraleCode(code, moduleKey) {
  const clean = (code||"").toString().trim();
  if (!/^\d{3,8}$/.test(clean)) return { valid:false, reason:"format" };
  try {
    // MÊME mécanisme que les apps magasin (réception / kelbongoo) : on envoie storeCode =
    // le nom de la colonne du registre à vérifier. Ici la colonne = le module
    // ("DISPATCH PALETTE" / "DECOUPE FROMAGE"). Le serveur déjà déployé coche cette colonne.

    const col = MODULE_COLUMN[moduleKey] || "";

      body:JSON.stringify({ action:"verify-code", code:clean, scope:"CENTRALE", storeCode:col, moduleColumn:col, module:moduleKey||"" })

    if (j && typeof j.valid === "boolean") return { valid:j.valid, name:(j.name||j.prenom||"").trim(), reason:j.reason||"", server:true };
    // Réponse inattendue -> repli
    return { valid:true, name:"", server:false, degraded:true };
  } catch(e) {
    // Serveur injoignable / action absente -> repli local (ne bloque pas l'entrepôt)

}

  let seen = []; try { seen = JSON.parse(localStorage.getItem("centrale_bcast_seen")||"[]"); } catch(e){}
  const mod = window.__centraleModule || null; // module courant (dispatch|decoupe|null)
  const list = Object.entries(__lastBcast).map(([id,b])=>({id,...b}))
    .filter(b => (!b.validUntil || b.validUntil>=now) && seen.indexOf(b.id)===-1)
    .filter(b => { const t=b.target||"all"; return t==="all" || !mod || t===mod; })
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let el = document.getElementById("centrale-bcast");
  if(!list.length){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement("div"); el.id="centrale-bcast"; el.className="bcast-wrap"; document.body.appendChild(el); }
  const esch = (s)=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  el.innerHTML = list.map(b=>`<div class="bcast"><span>📢 ${esch(b.message)}</span><button onclick="centraleDismissBcast('${b.id}')">✕ OK</button></div>`).join("");
}
window.centraleDismissBcast = function(id){
  try { const s=JSON.parse(localStorage.getItem("centrale_bcast_seen")||"[]"); if(s.indexOf(id)===-1){ s.push(id); localStorage.setItem("centrale_bcast_seen", JSON.stringify(s)); } } catch(e){}
  renderBroadcastBanner(__lastBcast);
};

/* =========================================================================
   EXCEL PARSING (fromage) — détecte désignation + colonnes ROB / KBG + poids
   ========================================================================= */
function parseFromageFile(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
  const N = (s) => stripAccents((s||"").toString()).toLowerCase().trim();
  const isRob = (n) => /(rob|robespierre|montreuil|pribon)/.test(n);
  const isKbg = (n) => /(kbg|kelbongoo|pantin)/.test(n);
  const isPoids = (n) => /(poids|grammage|gramme|piece.*g|pds)/.test(n);
  const isDesig = (n) => n.includes("designation")||n==="produit"||n==="libelle"||n==="nom"||n==="fromage"||n==="description"||n==="article";
  const isCode = (n) => n==="code"||n==="ref"||n==="reference"||n==="ean"||n==="code article"||n.includes("gencod");
  // Recherche de la ligne d'en-têtes
  let hIdx = -1, headers = null;
  for (let i=0; i<Math.min(rows.length,25); i++) {
    const r = rows[i].map(N);
    if (r.some(isDesig) && (r.some(isRob)||r.some(isKbg))) { hIdx=i; headers=rows[i]; break; }
  }
  if (hIdx === -1) {
    for (let i=0; i<Math.min(rows.length,25); i++) {
      const r = rows[i].map(N);
      if (r.some(isDesig)) { hIdx=i; headers=rows[i]; break; }
    }
  }
  if (hIdx === -1) throw new Error("Impossible de trouver une ligne d'en-têtes (désignation / fromage).");
  let iDes=-1, iCode=-1, iRob=-1, iKbg=-1, iPds=-1;
  headers.forEach((h,idx) => {
    const n = N(h); if (!n) return;
    if (iDes<0 && isDesig(n) && n!=="article") iDes=idx;
    if (iCode<0 && (isCode(n)||n==="article")) iCode=idx;
    if (iRob<0 && isRob(n)) iRob=idx;
    if (iKbg<0 && isKbg(n)) iKbg=idx;
    if (iPds<0 && isPoids(n)) iPds=idx;
  });
  if (iDes<0 && iCode>=0) iDes=iCode;
  if (iDes<0) throw new Error("Colonne désignation introuvable.");
  const num = (v) => { const n=parseFloat(String(v).replace(",",".").replace(/[^\d.]/g,"")); return isNaN(n)?0:n; };
  const products = [];
  for (let i=hIdx+1; i<rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const designation = (row[iDes]||"").toString().trim();
    if (!designation) continue;
    const dl = stripAccents(designation.toLowerCase());
    if (dl==="total"||dl==="totaux"||dl.includes("montant")) continue;
    const robCmd = iRob>=0 ? num(row[iRob]) : 0;
    const kbgCmd = iKbg>=0 ? num(row[iKbg]) : 0;
    const poids  = iPds>=0 && num(row[iPds])>0 ? num(row[iPds]) : FROMAGE_DEFAULT_POIDS;
    if (robCmd===0 && kbgCmd===0 && iRob<0 && iKbg<0) { /* pas de commande détectée: on garde quand même */ }
    products.push({
      article: iCode>=0 ? (row[iCode]||"").toString().trim() : "",
      designation,
      robCmd,                    // commande Robespierre (pièces ou kg selon usage)
      kbgTarget: Math.round(kbgCmd), // nb de pièces précises pour Kelbongoo (0 si vide)
      poids,                     // poids cible d'une pièce Kelbongoo (g)
      tol: FROMAGE_DEFAULT_TOL   // tolérance ± %
    });
  }
  if (!products.length) throw new Error("Aucune ligne fromage trouvée.");
  return { products, hasRob:iRob>=0, hasKbg:iKbg>=0, hasPoids:iPds>=0 };
}

/* =========================================================================
   EXCEL PARSING (dispatch)  — inchangé + détection colisage
   ========================================================================= */
const normCol = (s) => stripAccents((s||"").toString()).toLowerCase().trim();
const G5_STORE_MAP = {
  "01":"rob","03":"tol","98":"pdp","05":"bic","02":"bar","04":"bor",
  "06":"ces","07":"cha","09":"for","10":"lil","11":"nca","12":"ncc",
  "13":"pad","14":"pdc","17":"rom","18":"stb"
};
const NON_STORE_KEYWORDS = new Set([
  "article","code article","code","ref","reference","ean","barcode","sku",
  "designation","libelle","nom","produit","description",
  "quantite","qte","qty","uvc","uc","cde","cde en uvc","commande en uvc",
  "commande","cmd","cdt","pcb","colisage","conditionnement",
  "recue","receptionnee","recu","reception",
  "quantite receptionnee","quantites receptionnees","quantite cmd frs","quantite cmd",
  "prix","tarif","poids","poids kg","kg","tva","pu","pu ht","pu ttc","ht","ttc","puht","putc",
  "total","totale","totaux","totalite","montant","montant ht","montant tva","montant ttc",
  "remise","taux","marge","coef","coeff",
  "lot","dlc","ddm","fournisseur","frs","four","famille",""
]);
const parseG5Cell = (v) => {
  if (v===""||v===null||v===undefined) return 0;
  const s = v.toString().trim();
  const lastSep = s.lastIndexOf("|||");
  let numStr = lastSep>=0 ? s.substring(lastSep+3).trim() : s;
  const um = numStr.match(/^(\d+)\s*u/);
  if (um) return parseInt(um[1],10);
  const n = parseFloat(numStr);
  return isNaN(n) ? 0 : Math.round(n);
};

function parseExcelFile(workbook) {
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
  const isSigle = (s) => /^[a-z0-9]{2,6}$/.test(s) && !NON_STORE_KEYWORDS.has(s);
  const detectStoreColumn = (cellRaw, cellNorm) => {
    if (!cellNorm) return null;
    if (NON_STORE_KEYWORDS.has(cellNorm)) return null;
    if (cellNorm.startsWith("magasin")) {
      const code = cellNorm.replace(/^magasin\s*/,"").trim();
      const mapped = G5_STORE_MAP[code];
      if (mapped) { const uc = mapped.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; }
      return { code:`MAGASIN_${code}`, label:`Magasin ${code}`, needsNaming:true, originalHeader:cellRaw };
    }
    if (isSigle(cellNorm)) { const uc = cellNorm.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; }
    const tokens = cellNorm.split(/[\s\-_()\/]+/).filter(Boolean);
    for (const t of tokens) { if (isSigle(t)) { const uc = t.toUpperCase(); return { code:uc, label:uc, needsNaming:false }; } }
    return null;
  };
  let headerIdx = -1, headers = null;
  for (let i=0; i<Math.min(rows.length,20); i++) {
    const row = rows[i].map(c=>normCol(c));
    const hasDesig = row.some(c => c.includes("designation")||c==="produit"||c==="libelle"||c==="libellé"||c==="nom"||c==="article"||c==="description"||c.includes("designation produit"));
    if (hasDesig) { headerIdx = i; headers = rows[i]; break; }
  }
  if (headerIdx === -1) {
    for (let i=0; i<Math.min(rows.length,20); i++) {
      const row = rows[i].map(c=>normCol(c));
      const hasQty = row.some(c => c==="quantite"||c==="qte"||c==="qty"||c==="uvc"||c==="cde en uvc"||c==="cde"||c.includes("commande")||detectStoreColumn(null,c)!==null);
      const hasTextHeader = row.some(c => c.length>0 && c.length<50 && !/^\d+([.,]\d+)?$/.test(c));
      if (hasQty && hasTextHeader) { headerIdx = i; headers = rows[i]; break; }
    }
  }
  if (headerIdx === -1) throw new Error("Impossible de trouver une ligne d'en-têtes (produit/désignation/article/quantité/commande).");

  const colMap = {};
  let isG5Format = false;
  const articleAsCode = [];
  const storeColumns = [];
  headers.forEach((h, idx) => {
    const n = normCol(h);
    if (!n) return;
    if (n.includes("designation")||n==="produit"||n==="libelle"||n==="libellé"||n==="nom"||n==="description") {
      if (colMap.designation === undefined) colMap.designation = idx;
    }
    else if (n === "article") { articleAsCode.push(idx); }
    else if (n==="code article"||n==="code"||n==="ref"||n==="reference"||n==="référence"||n==="ean"||n==="ean13"||n==="gencod"||n==="gencode"||n==="code barre"||n==="code barres"||n==="barcode") {
      if (colMap.article === undefined) colMap.article = idx;
    }
    // Colisage / conditionnement (unités par carton)
    else if (n==="colisage"||n==="conditionnement"||n==="cond"||n==="pcb"||n==="cdt"||n.includes("colisage")||n.includes("conditionnement")||n.includes("par colis")||n.includes("nb colis")) {
      if (colMap.colisage === undefined) colMap.colisage = idx;
    }
    else if (detectStoreColumn(null,n)===null && (n.includes("cmd")||n==="commande"||(n.includes("commande") && !detectStoreColumn(null,n)))) {
      if (colMap.cmd === undefined) colMap.cmd = idx;
    }
    else if (n.includes("recept")||n.includes("recu")||n==="reçu") {
      if (colMap.recue === undefined) colMap.recue = idx;
    }
    else {
      const def = detectStoreColumn(h, n);
      if (def) { storeColumns.push({ idx, def }); if (n.startsWith("magasin")) isG5Format = true; }
    }
  });

  if (colMap.designation === undefined && articleAsCode.length > 0) {
    const articleIdx = articleAsCode[0];
    let textCount=0, numericCount=0;
    for (let i=headerIdx+1; i<Math.min(headerIdx+6,rows.length); i++) {
      const v = (rows[i]&&rows[i][articleIdx]) ? String(rows[i][articleIdx]).trim() : "";
      if (!v) continue;
      if (/^\d{6,}$/.test(v)) numericCount++;
      else if (v.length>5 && /[a-zA-Z]/.test(v)) textCount++;
    }
    if (textCount>numericCount) colMap.designation = articleIdx;
    else if (colMap.article === undefined) colMap.article = articleIdx;
  }
  if (colMap.designation === undefined) {
    const usedCols = new Set([colMap.article,colMap.cmd,colMap.recue,colMap.colisage,...storeColumns.map(s=>s.idx)].filter(x=>x!==undefined));
    let bestIdx=-1, bestAvgLen=0;
    for (let c=0; c<headers.length; c++) {
      if (usedCols.has(c)) continue;
      let totalLen=0, count=0;
      for (let i=headerIdx+1; i<Math.min(headerIdx+11,rows.length); i++) {
        const v = (rows[i]&&rows[i][c]) ? String(rows[i][c]).trim() : "";
        if (!v) continue;
        if (/^[\d\s.,]+$/.test(v)) continue;
        totalLen+=v.length; count++;
      }
      const avg = count>0 ? totalLen/count : 0;
      if (avg>bestAvgLen && avg>8) { bestAvgLen=avg; bestIdx=c; }
    }
    if (bestIdx!==-1) colMap.designation = bestIdx;
  }
  if (storeColumns.length === 0) {
    let quantityColIdx = -1;
    headers.forEach((h, idx) => {
      const n = normCol(h);
      if (!n) return;
      if (idx===colMap.article||idx===colMap.designation||idx===colMap.cmd||idx===colMap.recue||idx===colMap.colisage) return;
      if (quantityColIdx===-1 && (
        n==="quantite"||n==="qte"||n==="qty"||n==="commande en uvc"||n==="uvc"||n==="uc"||n==="cde en uvc"||n==="cde"||
        n.includes("cde en uvc")||n.includes("commande en uvc")||(n.includes("quantite")&&!n.includes("recept"))||
        (n.includes("commande")&&!detectStoreColumn(null,n))||(n.startsWith("cde")&&!detectStoreColumn(null,n))
      )) quantityColIdx = idx;
    });
    if (quantityColIdx!==-1) {
      storeColumns.push({ idx:quantityColIdx, def:{ code:`COL_${quantityColIdx}`, label:String(headers[quantityColIdx]||"Colonne quantité").trim(), needsNaming:true, originalHeader:headers[quantityColIdx] } });
    } else if (colMap.cmd!==undefined) {
      storeColumns.push({ idx:colMap.cmd, def:{ code:`COL_${colMap.cmd}`, label:String(headers[colMap.cmd]||"Commande").trim(), needsNaming:true, originalHeader:headers[colMap.cmd] } });
      colMap.cmd = undefined;
    }
  }
  if (colMap.designation === undefined) throw new Error("Impossible de trouver une colonne désignation/produit.");
  if (storeColumns.length === 0) throw new Error("Aucune colonne de quantité/magasin trouvée.");

  const products = [];
  for (let i=headerIdx+1; i<rows.length; i++) {
    const row = rows[i];
    if (!row || row.every(c=>c===""||c===null||c===undefined)) continue;
    const designation = (row[colMap.designation]||"").toString().trim();
    if (!designation) continue;
    const desigLower = stripAccents(designation.toLowerCase());
    if (desigLower.includes("montant ht")||desigLower.includes("montant ttc")||desigLower.includes("montant tva")||desigLower==="total"||desigLower==="totaux") continue;
    const parse = isG5Format ? parseG5Cell : (v) => {
      if (v===""||v===null||v===undefined) return 0;
      const s = v.toString().trim();
      if (s.includes("|||")) return parseG5Cell(s);
      const m = s.match(/^(\d+)\s*u/);
      if (m) return parseInt(m[1],10);
      const cleaned = s.replace(",",".");
      const n = parseFloat(cleaned);
      return isNaN(n) ? 0 : Math.round(n);
    };
    const stores = {};
    let total = 0;
    for (const sc of storeColumns) { const q = parse(row[sc.idx]); stores[sc.def.code]=q; total+=q; }
    if (total===0) continue;
    let recue = colMap.recue!==undefined ? parse(row[colMap.recue]) : total;
    let cmd = colMap.cmd!==undefined ? parse(row[colMap.cmd]) : recue;
    const colisage = colMap.colisage!==undefined ? parseColisage(row[colMap.colisage]) : 0;
    const cond = colMap.colisage!==undefined ? String(row[colMap.colisage]||"").trim() : "";
    products.push({
      article: colMap.article!==undefined ? (row[colMap.article]||"").toString().trim() : "",
      designation, cmd, recue, stores, colisage, cond
    });
  }
  const storeTotals = {};
  storeColumns.forEach(sc => { storeTotals[sc.def.code]=0; });
  products.forEach(p => { storeColumns.forEach(sc => { storeTotals[sc.def.code]+=(p.stores[sc.def.code]||0); }); });
  const keptStoreCols = storeColumns.filter(sc => !(sc.def.needsNaming && storeTotals[sc.def.code]===0));
  const removedCodes = storeColumns.filter(sc => !keptStoreCols.some(k=>k.def.code===sc.def.code)).map(sc=>sc.def.code);
  if (removedCodes.length>0) products.forEach(p => { removedCodes.forEach(code=>{ delete p.stores[code]; }); });
  return { products, storeColumns: keptStoreCols.map(s=>s.def) };
}

/* =========================================================================
   BDC — parseur léger colisage (fichier optionnel, matché au dispatch)
   ========================================================================= */
function parseBdcColisage(workbook) {
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
  let headerIdx=-1, headers=null;
  for (let i=0; i<Math.min(rows.length,25); i++) {
    const r = rows[i].map(c=>normCol(c));
    if (r.some(c => c.includes("colisage")||c.includes("conditionnement")||c==="pcb"||c==="cdt"||c.includes("par colis"))) { headerIdx=i; headers=rows[i]; break; }
  }
  if (headerIdx===-1) return { byArticle:{}, byName:{}, count:0 };
  let artIdx=-1, desIdx=-1, colIdx=-1;
  headers.forEach((h,idx) => {
    const n = normCol(h);
    if (colIdx===-1 && (n.includes("colisage")||n.includes("conditionnement")||n==="pcb"||n==="cdt"||n.includes("par colis"))) colIdx=idx;
    if (artIdx===-1 && (n==="code article"||n==="article"||n==="code"||n==="ean"||n==="ean13"||n==="ref"||n==="reference"||n.includes("gencod"))) artIdx=idx;
    if (desIdx===-1 && (n.includes("designation")||n==="produit"||n==="libelle"||n==="nom"||n==="description")) desIdx=idx;
  });
  const byArticle={}, byName={}; let count=0;
  for (let i=headerIdx+1; i<rows.length; i++) {
    const row = rows[i]; if (!row) continue;
    const col = colIdx>=0 ? parseColisage(row[colIdx]) : 0;
    if (!col || col<=1) continue;
    if (artIdx>=0) { const a=String(row[artIdx]||"").trim(); if (a){ byArticle[a]=col; count++; } }
    if (desIdx>=0) { const d=stripAccents(String(row[desIdx]||"").toLowerCase().trim()); if (d) byName[d]=col; }
  }
  return { byArticle, byName, count };
}
function applyColisage(products, map) {
  return products.map(p => {
    if (p.colisage && p.colisage>1) return p;
    let c = 0;
    if (p.article && map.byArticle[p.article]) c = map.byArticle[p.article];
    if (!c) { const d = stripAccents((p.designation||"").toLowerCase().trim()); if (map.byName[d]) c = map.byName[d]; }
    return c>1 ? { ...p, colisage:c } : p;
  });
}
// Idem, mais renvoie aussi un décompte (utile pour l'application rétroactive sur une session déjà envoyée).
function applyColisageWithCount(products, map) {
  let applied = 0, already = 0, missing = 0;
  const out = (products||[]).map(p => {
    if (p.colisage && p.colisage>1) { already++; return p; }
    let c = 0;
    if (p.article && map.byArticle[p.article]) c = map.byArticle[p.article];
    if (!c) { const d = stripAccents((p.designation||"").toLowerCase().trim()); if (map.byName[d]) c = map.byName[d]; }
    if (c>1) { applied++; return { ...p, colisage:c }; }
    missing++; return p;
  });
  return { products: out, applied, already, missing };
}

/* =========================================================================
   FIREBASE / SESSION SYNC
   ========================================================================= */
function useFirebaseSession(sessionId, operatorName) {
  const [state, setState] = useState({});
  const [meta, setMeta] = useState(null);
  const [connected, setConnected] = useState(false);
  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const stateRef = db.ref(`dispatch/${sessionId}/state`);
    const metaRef = db.ref(`dispatch/${sessionId}/meta`);
    const connectedRef = db.ref(".info/connected");
    const onState = (snap) => setState(snap.val()||{});
    const onMeta = (snap) => setMeta(snap.val()||null);
    const onConn = (snap) => setConnected(!!snap.val());
    stateRef.on("value", onState); metaRef.on("value", onMeta); connectedRef.on("value", onConn);
    return () => { stateRef.off("value",onState); metaRef.off("value",onMeta); connectedRef.off("value",onConn); };
  }, [sessionId]);
  const updateLocal = useCallback((key, patch) => { setState(prev => ({ ...prev, [key]:{ ...(prev[key]||{}), ...patch } })); }, []);
  const lockRow = useCallback((key) => {
    const patch = { lockedBy:operatorName, lockedAt:Date.now() };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, operatorName, updateLocal]);
  const unlockRow = useCallback((key) => {
    const patch = { lockedBy:null, lockedAt:null };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, updateLocal]);
  const validateRow = useCallback((key, qtys) => {
    const patch = { done:true, doneBy:operatorName, doneAt:Date.now(), lockedBy:null, lockedAt:null, ...(qtys||{}) };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, operatorName, updateLocal]);
  const undoRow = useCallback((key) => {
    const patch = { done:false, doneBy:null, doneAt:null, ecarts:null };
    if (firebaseReady && sessionId) db.ref(`dispatch/${sessionId}/state/${key}`).update(patch); else updateLocal(key,patch);
  }, [sessionId, updateLocal]);
  return { state, meta, connected: firebaseReady?connected:true, lockRow, unlockRow, validateRow, undoRow };
}

// Abonnement global à toutes les sessions dispatch (accueil, palettes, admin).
function useAllSessions() {
  const [sessions, setSessions] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("dispatch");
    const h = (snap) => setSessions(snap.val()||{});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, []);
  return sessions;
}

/* =========================================================================
   PALETTES FICTIVES — agrégation par magasin
   ========================================================================= */
// Construit, pour le jour choisi, les items dispatchés par magasin.
function buildPaletteItems(allSessions, dateKey) {
  const byStore = {}; // code -> { label, items:[] }
  Object.entries(allSessions||{}).forEach(([sid, s]) => {
    if (!s || !s.meta) return;
    const supplier = s.meta.supplier || "?";
    const products = s.meta.products || [];
    const cols = s.meta.storeColumns || [];
    const labelOf = {};
    cols.forEach(c => { labelOf[c.code] = c.label; });
    products.forEach((p, idx) => {
      const pkey = productKey(p, idx);
      const st = (s.state && s.state[pkey]) || {};
      if (!st.done || !st.doneAt) return;
      if (keyOfTs(st.doneAt) !== dateKey) return;
      const codes = new Set([...Object.keys(p.stores||{}), ...Object.keys(st.qtyStores||{})]);
      codes.forEach(code => {
        const q = effQty(st, p, code);
        if (!q || q<=0) return;
        if (!byStore[code]) byStore[code] = { label: labelOf[code]||code, items:[] };
        if (!byStore[code].label || byStore[code].label===code) byStore[code].label = labelOf[code]||code;
        byStore[code].items.push({
          sid, supplier, article:p.article||"", designation:p.designation,
          qty:q, colisage:p.colisage||0, doneAt:st.doneAt, pkey
        });
      });
    });
  });
  Object.values(byStore).forEach(s => s.items.sort((a,b)=>a.doneAt-b.doneAt));
  return byStore;
}
// Découpe les items d'un magasin en palettes selon les bornes de clôture (closes).
function splitIntoPalettes(items, closes) {
  const sorted = [...(closes||[])].sort((a,b)=>a-b);
  const palettes = sorted.map((ts,i) => ({ n:i+1, sentAt:ts, sent:true, items:[] }));
  const open = { n: sorted.length+1, sentAt:null, sent:false, items:[] };
  items.forEach(it => {
    let placed = false;
    for (let i=0;i<sorted.length;i++){ if (it.doneAt <= sorted[i]) { palettes[i].items.push(it); placed=true; break; } }
    if (!placed) open.items.push(it);
  });
  return { palettes, open };
}
// Agrège les items d'une palette : par fournisseur + totaux colis / hors-colis.
function aggregatePalette(items) {
  const bySupplier = {};
  let totalArticles = 0, totalColis = 0, totalHors = 0;
  const refs = new Set();
  items.forEach(it => {
    if (!bySupplier[it.supplier]) bySupplier[it.supplier] = { qty:0, colis:0, hors:0, lines:[] };
    const { colis, hors } = cartonSplit(it.qty, it.colisage);
    bySupplier[it.supplier].qty += it.qty;
    bySupplier[it.supplier].colis += colis;
    bySupplier[it.supplier].hors += hors;
    bySupplier[it.supplier].lines.push({ ...it, colis, hors });
    totalArticles += it.qty; totalColis += colis; totalHors += hors;
    refs.add((it.article||it.designation)+"|"+it.supplier);
  });
  return { bySupplier, totalArticles, totalColis, totalHors, nbRefs: refs.size };
}

function usePalettesCloses(dateKey) {
  const [closes, setCloses] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref(`palettes/${dateKey}`);
    const h = (snap) => setCloses(snap.val()||{});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, [dateKey]);
  return closes;
}
function closePalette(dateKey, storeCode, currentCloses) {
  if (!firebaseReady) return;
  const list = [ ...((currentCloses && currentCloses.closes)||[]), Date.now() ];
  db.ref(`palettes/${dateKey}/${storeCode}/closes`).set(list);
}
function reopenLastPalette(dateKey, storeCode, currentCloses) {
  if (!firebaseReady) return;
  const list = [ ...((currentCloses && currentCloses.closes)||[]) ];
  list.pop();
  db.ref(`palettes/${dateKey}/${storeCode}/closes`).set(list);
}

/* =========================================================================
   FIREBASE — SESSIONS DÉCOUPE FROMAGE  (nœud "decoupe")
   ========================================================================= */
function useDecoupeSession(sessionId, operator) {
  const [state, setState] = useState({});
  const [meta, setMeta] = useState(null);
  const [connected, setConnected] = useState(false);
  useEffect(() => {
    if (!firebaseReady || !sessionId) return;
    const stateRef = db.ref(`decoupe/${sessionId}/state`);
    const metaRef = db.ref(`decoupe/${sessionId}/meta`);
    const connectedRef = db.ref(".info/connected");
    const onState = (snap)=>setState(snap.val()||{});
    const onMeta = (snap)=>setMeta(snap.val()||null);
    const onConn = (snap)=>setConnected(!!snap.val());
    stateRef.on("value", onState); metaRef.on("value", onMeta); connectedRef.on("value", onConn);
    return () => { stateRef.off("value",onState); metaRef.off("value",onMeta); connectedRef.off("value",onConn); };
  }, [sessionId]);
  const updateLocal = useCallback((key,patch)=>{ setState(prev=>({ ...prev, [key]:{ ...(prev[key]||{}), ...patch } })); }, []);
  const setRow = useCallback((key, patch) => {
    if (firebaseReady && sessionId) db.ref(`decoupe/${sessionId}/state/${key}`).update(patch); else updateLocal(key, patch);
  }, [sessionId, updateLocal]);
  return { state, meta, connected: firebaseReady?connected:true, setRow };
}
function useAllDecoupe() {
  const [sessions, setSessions] = useState({});
  useEffect(() => {
    if (!firebaseReady) return;
    const ref = db.ref("decoupe");
    const h = (snap)=>setSessions(snap.val()||{});
    ref.on("value", h);
    return () => ref.off("value", h);
  }, []);
  return sessions;
}
// Bornes de tolérance Kelbongoo (grammes) pour un fromage.
const frBounds = (p) => {
  const w = p.poids||FROMAGE_DEFAULT_POIDS, t = (p.tol!=null?p.tol:FROMAGE_DEFAULT_TOL)/100;
  return { min: Math.round(w*(1-t)), max: Math.round(w*(1+t)) };
};
// Décide de l'entité d'une pièce selon son poids + le nb de pièces KBG déjà faites.
const frRoute = (product, weight, kbgDone) => {
  const { min, max } = frBounds(product);
  const need = (product.kbgTarget||0) > 0 ? (kbgDone < product.kbgTarget) : (product.kbgTarget===0 && (product.robCmd||0)===0 ? true : false);
  // Dans la tolérance ET Kelbongoo a encore besoin de pièces -> KBG, sinon Robespierre.
  if (weight>=min && weight<=max && (need || (product.kbgTarget||0)===0 && (product.robCmd||0)===0)) return "KBG";
  return "ROB";
};
// Agrège l'état d'un fromage (pièces déjà coupées).
function frAgg(status) {
  const pieces = (status && status.pieces) || [];
  let kbgN=0, kbgG=0, robN=0, robG=0;
  pieces.forEach(pc => { if (pc.dest==="KBG"){ kbgN++; kbgG+=pc.w; } else { robN++; robG+=pc.w; } });
  return { kbgN, kbgG, robN, robG, total:pieces.length };
}

function CodeLoginScreen({ moduleLabel, moduleKey, onLogin, onBack }) {
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const submit = async () => {
    const c = code.trim();
    if (!/^\d{3,8}$/.test(c)) { setError("Entre ton code (3 à 8 chiffres)."); return; }
    setBusy(true); setError("");
    const res = await verifyCentraleCode(c, moduleKey);
    setBusy(false);
    if (!res.valid) { setError(res.reason==="module" ? "Ton code n'a pas accès à ce module." : "Code non reconnu. Vérifie auprès du gérant."); return; }
    const name = res.name || "";
    localStorage.setItem("centrale_op_code", c);
    localStorage.setItem("centrale_op_at", String(Date.now()));
    if (name) localStorage.setItem("centrale_op_name", name);
    onLogin({ code:c, name });
  };
  const tap = (d) => { setError(""); setCode(v => (v.length<8 ? v+d : v)); };
  const del = () => setCode(v => v.slice(0,-1));
  return (
    <div className="screen-center">
      <div className="logo">{BRAND}</div>
      <div className="tag">{moduleLabel}</div>
      <div className="card">
        <div className="field">
          <label>Ton code</label>
          <input type="tel" inputMode="numeric" value={code} onChange={e=>{ setError(""); setCode(e.target.value.replace(/\D/g,"").slice(0,8)); }} placeholder="•••••" autoFocus
            onKeyDown={e=>e.key==="Enter"&&submit()} style={{textAlign:"center", fontSize:30, letterSpacing:8, fontWeight:800}} />
        </div>
        <div className="keypad" style={{marginBottom:14}}>
          {["1","2","3","4","5","6","7","8","9"].map(d=><button key={d} onClick={()=>tap(d)}>{d}</button>)}
          <button className="del" onClick={del}>⌫</button>
          <button onClick={()=>tap("0")}>0</button>
          <button className="act" onClick={submit} disabled={busy}>✓</button>
        </div>
        {error && <div style={{color:"#c62828", background:"#ffebee", padding:10, borderRadius:6, fontSize:13, marginBottom:10}}>{error}</div>}
        <button className="btn-primary" onClick={submit} disabled={busy || !code.trim()}>{busy?"Vérification…":"Continuer"}</button>
        <button className="btn-secondary" onClick={onBack}>← Retour au menu</button>
      </div>
    </div>
  );
}

function launchConfetti(){
  try{
    const c=document.createElement('canvas');
    c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:99999';
    c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
    const ctx=c.getContext('2d'), cols=['#e53935','#1a4d2e','#ff9800','#4caf50','#2196f3','#ffd600','#e91e63'];
    const burst=(cx,cy)=>Array.from({length:80},()=>({x:cx,y:cy,vx:(Math.random()-.5)*12,vy:(Math.random()-1)*12-3,g:.28,col:cols[(Math.random()*cols.length)|0],s:4+Math.random()*4,life:70+Math.random()*40}));
    let P=burst(innerWidth*.5,innerHeight*.4);
    setTimeout(()=>P=P.concat(burst(innerWidth*.25,innerHeight*.45)),250);
    setTimeout(()=>P=P.concat(burst(innerWidth*.75,innerHeight*.45)),500);
    let t=0;(function f(){ t++; ctx.clearRect(0,0,c.width,c.height);
      P.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; ctx.globalAlpha=Math.max(0,p.life/90); ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,p.s,p.s); });
      P=P.filter(p=>p.life>0);
      if(t<180) requestAnimationFrame(f); else c.remove();
    })();
  }catch(e){}
}
function ProductCard({ product, pkey, status, operator, storeColumns, onLock, onUnlock, onValidate, onUndo, onEdit }) {

  const getQty = (code) => (status.qtyStores && status.qtyStores[code]!==undefined) ? status.qtyStores[code] : ((product.stores && product.stores[code])||0);

   MODALE D'AJUSTEMENT + MOTIF D'ÉCART
   ========================================================================= */
function EditModal({ product, status, storeColumns, onSave, onClose, allowReceivedEdit }) {
  const getInitial = (code) => {
    if (status.qtyStores && status.qtyStores[code]!==undefined) return String(status.qtyStores[code]);
    return String((product.stores && product.stores[code])||0);
  };
  const [qties, setQties] = useState(() => { const init={}; storeColumns.forEach(s=>{ init[s.code]=getInitial(s.code); }); return init; });
  const [recue, setRecue] = useState(String(status.qtyRecue!==undefined ? status.qtyRecue : product.recue));
  const [reasons, setReasons] = useState({}); // code|CENTRALE -> {reason, text}

  const toNum = (s) => { if (s===""||s===null||s===undefined) return 0; const n=parseInt(s,10); return isNaN(n)?0:n; };
  const handleNumChange = (code) => (e) => { const v=e.target.value; if (v===""||/^\d+$/.test(v)) setQties(prev=>({...prev,[code]:v})); };
  const handleRecueChange = (e) => { const v=e.target.value; if (v===""||/^\d+$/.test(v)) setRecue(v); };

  const recueN = toNum(recue);
  let total = 0; const numQties = {};
  storeColumns.forEach(s => { const n=toNum(qties[s.code]); numQties[s.code]=n; total+=n; });
  const gap = total - recueN;

  // Écarts = magasins où on dispatch MOINS que prévu, + centrale si reçu réduit.
  const diffs = [];
  storeColumns.forEach(s => {
    const planned = (product.stores && product.stores[s.code])||0;
    if (numQties[s.code] < planned) diffs.push({ key:s.code, store:s.label, code:s.code, planned, real:numQties[s.code] });
  });
  if (allowReceivedEdit && recueN < product.recue) {
    diffs.push({ key:"CENTRALE", store:"CENTRALE (reçu)", code:"CENTRALE", planned:product.recue, real:recueN });
  }
  const needReasons = diffs.length > 0;
  const missing = diffs.some(d => {
    const r = reasons[d.key];
    if (!r || !r.reason) return true;
    if (r.reason==="AUTRE" && !(r.text||"").trim()) return true;
    return false;
  });

  const setReason = (key, patch) => setReasons(prev => ({ ...prev, [key]: { ...(prev[key]||{}), ...patch } }));

  const handleSave = () => {
    const ecarts = diffs.map(d => ({
      store: d.code, storeLabel: d.store, planned: d.planned, real: d.real, delta: d.real-d.planned,
      reason: (reasons[d.key]||{}).reason || "AUTRE",
      reasonText: ((reasons[d.key]||{}).text || "").trim(),
      fournisseur: reasonIsFournisseur((reasons[d.key]||{}).reason)
    }));
    onSave({ qtyStores:numQties, qtyRecue:recueN, ecarts: ecarts.length ? ecarts : null });
  };

  const nbStores = storeColumns.length;
  const gridCols = nbStores<=3 ? `repeat(${nbStores},1fr)` : "repeat(2,1fr)";

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3>Ajuster les quantités</h3>
        <div className="designation-modal">{product.designation}{product.colisage>1?` · colis de ${product.colisage}`:""}</div>

        {allowReceivedEdit && (
          <div style={{background:"#fff3e0", padding:10, borderRadius:8, marginBottom:12, border:"1px solid #ffcc80"}}>
            <div style={{fontSize:11, fontWeight:700, color:"#e65100", marginBottom:4}}>QUANTITÉ REÇUE (centrale)</div>
            <input type="text" inputMode="numeric" pattern="[0-9]*" value={recue} onChange={handleRecueChange} onFocus={e=>e.target.select()} style={{width:"100%", padding:10, fontSize:22, fontWeight:700, textAlign:"center", border:"1.5px solid #ff9800", borderRadius:6}} />
            <div style={{fontSize:10, color:"#666", marginTop:4, textAlign:"center"}}>Initial: {product.recue}</div>
          </div>
        )}

        <div style={{fontSize:12, fontWeight:600, color:"#666", marginBottom:6}}>RÉPARTITION PAR MAGASIN</div>
        <div className="edit-grid" style={{gridTemplateColumns:gridCols}}>
          {storeColumns.map(s => (
            <div className="edit-cell" key={s.code}>
              <label>{s.label}</label>
              <input type="text" inputMode="numeric" pattern="[0-9]*" value={qties[s.code]} onChange={handleNumChange(s.code)} onFocus={e=>e.target.select()} />
            </div>
          ))}
        </div>

        <div style={{fontSize:12, marginBottom:12, textAlign:"center", padding:8, borderRadius:6, background:gap===0?"#e8f5e9":"#ffebee", color:gap===0?"#1a4d2e":"#c62828", fontWeight:600}}>
          Total réparti: {total} / Reçu: {recueN}
          {gap!==0 && <div style={{fontSize:11, marginTop:2}}>{gap>0?`⚠️ Surplus de ${gap}`:`⚠️ Manque ${-gap}`}</div>}
          {gap===0 && <div style={{fontSize:11, marginTop:2}}>✓ Total cohérent</div>}
        </div>

        {needReasons && (
          <div className="reason-block">
            <div className="rb-title">⚠️ MOTIF DE L'ÉCART (obligatoire)</div>
            {diffs.map(d => (
              <div className="reason-row" key={d.key}>
                <div className="rr-line">{d.store} : {d.planned} → <b>{d.real}</b> ({d.real-d.planned})</div>
                <select value={(reasons[d.key]||{}).reason||""} onChange={e=>setReason(d.key,{reason:e.target.value})}>
                  <option value="">— Choisir un motif —</option>
                  {ECART_REASONS.map(r => <option key={r.code} value={r.code}>{r.code}{r.fournisseur?" (avoir fournisseur)":" (interne)"}</option>)}
                </select>
                {(reasons[d.key]||{}).reason==="AUTRE" && (
                  <input type="text" placeholder="Préciser le motif…" value={(reasons[d.key]||{}).text||""} onChange={e=>setReason(d.key,{text:e.target.value})} />
                )}
              </div>
            ))}
          </div>
        )}

        <div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>Annuler</button>
          <button className="btn-confirm" onClick={handleSave} disabled={needReasons && missing}>Valider</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   SCANNER CAMÉRA — lecture code-barres via la caméra (html5-qrcode)
   ========================================================================= */
function CameraScanner({ onDetect, onClose }) {
  const [error, setError] = useState("");
  const [ready, setReady] = useState(false);
  const scannerRef = useRef(null);
  const stoppedRef = useRef(false);
  const divId = "cam-reader";
  useEffect(() => {
    if (typeof Html5Qrcode === "undefined") {
      setError("Le module scanner n'a pas pu se charger (réseau ou bloqueur). Réessaie ou utilise la douchette.");
      return;
    }
    const scanner = new Html5Qrcode(divId, { verbose:false });
    scannerRef.current = scanner;
    const config = { fps: 12, qrbox: { width: 260, height: 150 }, aspectRatio: 1.3 };
    const onSuccess = (decodedText) => {
      if (stoppedRef.current) return;
      stoppedRef.current = true;
      try { navigator.vibrate && navigator.vibrate(70); } catch(e){}
      const finish = () => onDetect((decodedText||"").trim());
      try { scanner.stop().then(finish).catch(finish); } catch(e){ finish(); }
    };
    scanner.start({ facingMode: "environment" }, config, onSuccess, () => {})
      .then(() => setReady(true))
      .catch(() => {
        setError("Impossible d'ouvrir la caméra. Autorise l'accès caméra pour ce site (et vérifie qu'il est bien en HTTPS).");
      });
    return () => {
      stoppedRef.current = true;
      const s = scannerRef.current;
      if (s) { try { s.stop().then(()=>{ try{s.clear();}catch(e){} }).catch(()=>{}); } catch(e){} }
    };
  }, []);
  return (
    <div className="modal-backdrop" style={{background:"rgba(0,0,0,.9)", flexDirection:"column", padding:16}}>
      <div style={{color:"#fff", fontWeight:700, fontSize:16, marginBottom:12}}>📷 Scanne le code-barres</div>
      <div style={{width:"100%", maxWidth:420, borderRadius:12, overflow:"hidden", background:"#000"}}>
        <div id={divId} style={{width:"100%"}}></div>
      </div>
      {!ready && !error && <div style={{color:"#ddd", fontSize:13, marginTop:12}}>Ouverture de la caméra…</div>}
      {error && <div style={{color:"#ffcdd2", fontSize:13, marginTop:12, textAlign:"center", maxWidth:360}}>{error}</div>}
      <button onClick={onClose} style={{marginTop:18, background:"#fff", color:"#1a1a1a", padding:"12px 28px", borderRadius:10, fontWeight:700, fontSize:15}}>Fermer</button>
    </div>
  );
}

function DispatchScreen({ sessionId, operator, supplier, products, storeColumns, onFinish, onLeave }) {
  const { state, meta, connected, lockRow, unlockRow, validateRow, undoRow } = useFirebaseSession(sessionId, operator);
  const [search, setSearch] = useState("");
  const [editingKey, setEditingKey] = useState(null);
  const [editAllowReceived, setEditAllowReceived] = useState(false);
  const [toast, setToast] = useState("");
  const [viewMode, setViewMode] = useState(localStorage.getItem("dispatch_view_mode")||"list");
  const [showDone, setShowDone] = useState(false);
  const [showCam, setShowCam] = useState(false);
  const searchInputRef = useRef(null);
  const onCamDetect = (code) => { setShowCam(false); setSearch(code); setTimeout(()=>searchInputRef.current&&searchInputRef.current.focus(),80); };

  const effectiveStoreColumns = useMemo(() => {
    if (meta && Array.isArray(meta.storeColumns) && meta.storeColumns.length>0) return meta.storeColumns;
    if (Array.isArray(storeColumns) && storeColumns.length>0) return storeColumns;
    if (products.length>0 && products[0].stores) return Object.keys(products[0].stores).map(code=>({code,label:code,needsNaming:false}));
    return [];
  }, [meta, storeColumns, products]);

  const normalizedProducts = useMemo(() => products.map(p => p.stores ? p : { ...p, stores:{} }), [products]);

  useEffect(() => { localStorage.setItem("dispatch_view_mode", viewMode); }, [viewMode]);
  useEffect(() => {
    const t = setInterval(() => {
      Object.entries(state).forEach(([k,v]) => { if (v && v.lockedBy===operator && !v.done) lockRow(k); });
    }, LOCK_REFRESH_MS);
    return () => clearInterval(t);
  }, [state, operator, lockRow]);

  const sortedProducts = useMemo(() => normalizedProducts.map((p,idx)=>({...p,_pkey:productKey(p,idx)})).sort((a,b)=>a.designation.localeCompare(b.designation,"fr")), [normalizedProducts]);
  const { notDoneProducts, doneProducts } = useMemo(() => {
    const notDone=[], done=[];
    sortedProducts.forEach(p => { if (state[p._pkey]&&state[p._pkey].done) done.push(p); else notDone.push(p); });
    return { notDoneProducts:notDone, doneProducts:done };
  }, [sortedProducts, state]);

  const filtered = useMemo(() => {
    const source = showDone ? doneProducts : notDoneProducts;
    const q = search.trim();
    if (!q) return source;
    if (isBarcode(q)) return source.filter(p => barcodeMatch(p.article, q));
    return source.filter(p => smartMatch(p.designation, q) || (p.article||"").includes(q));
  }, [notDoneProducts, doneProducts, showDone, search]);

  const stats = useMemo(() => {
    const total = sortedProducts.length;
    const done = sortedProducts.filter(p => state[p._pkey]&&state[p._pkey].done).length;
    return { total, done, remaining: total-done };
  }, [sortedProducts, state]);

  const showToast = (m) => { setToast(m); setTimeout(()=>setToast(""),1500); };
  const handleValidate = (pkey, qtys) => { validateRow(pkey, qtys); showToast("✓ Validé"); };
  const handleUndo = (pkey) => { undoRow(pkey); showToast("↶ Annulé"); };
  const handleEdit = (pkey, allowRecu) => { lockRow(pkey); setEditAllowReceived(!!allowRecu); setEditingKey(pkey); };
  const handleEditSave = (qtys) => { if (editingKey) { validateRow(editingKey, qtys); showToast(qtys.ecarts?"⚠ Écart enregistré":"✓ Ajusté et validé"); } setEditingKey(null); };
  const handleEditCancel = () => { if (editingKey) unlockRow(editingKey); setEditingKey(null); };
  const editingProduct = editingKey ? sortedProducts.find(p=>p._pkey===editingKey) : null;

  const handleValidateScan = (pkey, qtys) => { handleValidate(pkey, qtys); if (viewMode==="scan") { setSearch(""); setTimeout(()=>searchInputRef.current&&searchInputRef.current.focus(),50); } };

  const downloadBl = () => {
    const header = ["Article","Désignation","Colisage","Quantité reçue", ...effectiveStoreColumns.map(s=>s.label)];
    const dataRows = sortedProducts.map(p => [ p.article||"", p.designation||"", p.colisage||"", p.recue!=null?p.recue:"", ...effectiveStoreColumns.map(s=>p.stores&&p.stores[s.code]!=null?p.stores[s.code]:0) ]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...dataRows]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Dispatch");
    const clean = (s)=>(s||"").replace(/[^a-zA-Z0-9_\-]/g,"_");
    XLSX.writeFile(wb, `Dispatch_${clean(supplier)}_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  return (
    <div className="app">
      <div className="header">
        <div className="header-row">
          <div>
            <h1>{supplier}</h1>
            <div className="sub">{BRAND} • {operator} • <span className={`conn-status ${!connected?"offline":""}`}>{connected?"● en ligne":"● hors ligne"}</span></div>
          </div>
          <div className="header-actions">
            <button className="header-btn" onClick={downloadBl} title="Re-télécharger le fichier">⬇</button>
            <button className="header-btn" onClick={()=>setViewMode(viewMode==="list"?"scan":"list")} style={{background:viewMode==="scan"?"#ffb300":"rgba(255,255,255,.15)"}}>{viewMode==="scan"?"📋 Liste":"⚡ Scan"}</button>
            <button className="header-btn" onClick={onLeave}>Quitter</button>
          </div>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${stats.total>0?(stats.done/stats.total)*100:0}%`}}></div></div>
        <div className="progress-text" style={{color:"rgba(255,255,255,.85)"}}><span>{stats.done} / {stats.total} produits</span><span>{stats.remaining} restants</span></div>
      </div>

      <div className="tabs-bar">
        <button className={`tab ${!showDone?"active":""}`} onClick={()=>{ setShowDone(false); setSearch(""); }}>À faire ({notDoneProducts.length})</button>
        <button className={`tab ${showDone?"active":""}`} onClick={()=>{ setShowDone(true); setSearch(""); }}>✓ Dispatchés ({doneProducts.length})</button>
      </div>

      {viewMode==="scan" && !showDone && (
        <div className="scan-mode">
          <div className="scan-search-wrap">
            <input ref={searchInputRef} className="scan-search-input" type="text" placeholder="Scanne le code-barres ou tape le nom…" value={search} onChange={e=>setSearch(e.target.value)} autoFocus />
            {search && <button className="scan-clear" onClick={()=>{ setSearch(""); searchInputRef.current&&searchInputRef.current.focus(); }}>✕</button>}
          </div>
          <button onClick={()=>setShowCam(true)} style={{width:"100%", padding:14, fontSize:16, fontWeight:800, background:"#1a4d2e", color:"#fff", borderRadius:12, marginBottom:16, display:"flex", alignItems:"center", justifyContent:"center", gap:8}}>📷 Scanner avec la caméra</button>
          {!search.trim() && (
            <div className="scan-hint">
              <div style={{fontSize:40, marginBottom:8}}>⚡</div>
              <div style={{fontWeight:600, marginBottom:4}}>Mode scan / recherche rapide</div>
              <div style={{fontSize:13, color:"#666"}}>Scanne le code EAN du produit, ou tape 2-3 lettres du nom.</div>
              <div style={{fontSize:12, color:"#999", marginTop:12}}>{notDoneProducts.length} produits restants</div>
            </div>
          )}
          {search.trim() && filtered.length===0 && (
            <div className="scan-hint">
              <div style={{fontSize:30, marginBottom:8}}>🔍</div>
              <div style={{color:"#999"}}>Aucun produit ne correspond à "<b>{search}</b>"</div>
              <div style={{fontSize:12, color:"#aaa", marginTop:8}}>{isBarcode(search)?"Code-barres inconnu dans ce dispatch.":"Vérifie l'orthographe ou bascule en mode liste."}</div>
            </div>
          )}
          {search.trim() && filtered.length>0 && (
            <div className="scan-results">
              {filtered.slice(0,5).map(p => (
                <ProductCard key={p._pkey} product={p} pkey={p._pkey} status={state[p._pkey]||{}} operator={operator} storeColumns={effectiveStoreColumns} onLock={lockRow} onUnlock={unlockRow} onValidate={handleValidateScan} onUndo={handleUndo} onEdit={handleEdit} />
              ))}
              {filtered.length>5 && <div style={{textAlign:"center", color:"#999", fontSize:12, padding:8}}>+ {filtered.length-5} autres… précise ta recherche</div>}
            </div>
          )}
        </div>
      )}

      {(viewMode==="list" || showDone) && (
        <>
          <div className="search-bar">
            <input type="text" placeholder={showDone?"🔍 Chercher dans les dispatchés…":"🔍 Chercher un produit (nom ou code EAN)…"} value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          <div className="product-list">
            {filtered.length===0 && <div style={{textAlign:"center", padding:40, color:"#999"}}>{showDone?(search.trim()?"Aucun résultat":"Aucun produit dispatché"):(search.trim()?"Aucun résultat":"🎉 Tous les produits sont dispatchés !")}</div>}
            {filtered.map(p => (
              <ProductCard key={p._pkey} product={p} pkey={p._pkey} status={state[p._pkey]||{}} operator={operator} storeColumns={effectiveStoreColumns} onLock={lockRow} onUnlock={unlockRow} onValidate={handleValidate} onUndo={handleUndo} onEdit={handleEdit} />
            ))}
          </div>
        </>
      )}

      <div className="bottom-bar">
        <div className="stats"><span>Avancement: <b>{stats.done}/{stats.total}</b></span><span>{stats.total>0?Math.round((stats.done/stats.total)*100):0}%</span></div>
        <button className="btn-finish" onClick={()=>{ if(stats.done===stats.total) launchConfetti(); onFinish(state, sortedProducts); }} disabled={stats.done===0}>{stats.done===stats.total?"✓ Terminer et voir le récap":`Voir le récap (${stats.done} validés)`}</button>
      </div>

      {editingProduct && (
        <EditModal product={editingProduct} status={state[editingKey]||{}} storeColumns={effectiveStoreColumns} allowReceivedEdit={editAllowReceived} onSave={handleEditSave} onClose={handleEditCancel} />
      )}
      {showCam && <CameraScanner onDetect={onCamDetect} onClose={()=>setShowCam(false)} />}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* =========================================================================
   RÉCAP DISPATCH
   ========================================================================= */
function RecapScreen({ sessionId, operator, supplier, products, storeColumns, state, onClose, onLeave }) {
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [error, setError] = useState("");

  const analysis = useMemo(() => {
    const total = products.length;
    const done = products.filter(p => state[p._pkey] && state[p._pkey].done).length;
    const notDone = products.filter(p => !(state[p._pkey] && state[p._pkey].done));
    const timestamps = products.map(p => state[p._pkey] && state[p._pkey].doneAt).filter(t=>t).sort((a,b)=>a-b);
    const startedAt = timestamps[0], endedAt = timestamps[timestamps.length-1];
    const duration = startedAt && endedAt ? endedAt-startedAt : 0;
    const byOp = {};
    products.forEach(p => { const s=state[p._pkey]; if (s&&s.done&&s.doneBy) byOp[s.doneBy]=(byOp[s.doneBy]||0)+1; });
    const getEQ = (p, code) => { const s=state[p._pkey]; if(!s) return (p.stores&&p.stores[code])||0; if(s.qtyStores&&s.qtyStores[code]!==undefined) return s.qtyStores[code]; return (p.stores&&p.stores[code])||0; };
    const ecarts = [];
    products.forEach(p => { const s=state[p._pkey]; if (s&&s.done&&s.ecarts&&s.ecarts.length) s.ecarts.forEach(e=>ecarts.push({ ...e, designation:p.designation, article:p.article })); });
    return { total, done, notDone, startedAt, endedAt, duration, byOp, getEQ, ecarts };
  }, [products, state, storeColumns]);

  const sendRecap = async () => {
    setSending(true); setError("");
    const payload = {
      action:"log-dispatch-recap", sessionId, supplier, operator, brand:BRAND,
      startedAt: analysis.startedAt ? new Date(analysis.startedAt).toISOString() : null,
      endedAt: analysis.endedAt ? new Date(analysis.endedAt).toISOString() : null,
      durationMs: analysis.duration, total: analysis.total, done: analysis.done, notDone: analysis.notDone.length,
      byOperator: analysis.byOp, storeColumns, ecarts: analysis.ecarts,
      lines: products.map(p => {
        const s = state[p._pkey]||{};
        const stores_prevu={}, stores_reel={};
        storeColumns.forEach(sc => { stores_prevu[sc.code]=(p.stores&&p.stores[sc.code])||0; stores_reel[sc.code]=analysis.getEQ(p, sc.code); });
        return { article:p.article, designation:p.designation, colisage:p.colisage||0, recue_initiale:p.recue, recue: s.qtyRecue!==undefined?s.qtyRecue:p.recue, stores_prevu, stores_reel, ecarts:s.ecarts||[], done:!!s.done, doneBy:s.doneBy||"", doneAt:s.doneAt?new Date(s.doneAt).toISOString():"" };
      })
    };
    try {
      await fetch(APPS_SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload) });
      setSent(true);
    } catch(e) { setError(`Erreur: ${e.message}`); } finally { setSending(false); }
  };

  return (
    <div className="app">
      <div className="header">
        <div className="header-row">
          <div><h1>Récap dispatch</h1><div className="sub">{supplier}</div></div>
          <div className="header-actions"><button className="header-btn" onClick={onClose}>← Retour</button></div>
        </div>
      </div>
      <div className="recap-section">
        <div className="recap-card">
          <h3>📊 Avancement</h3>
          <div className="recap-stat"><span className="label">Produits totaux</span><span className="value">{analysis.total}</span></div>
          <div className="recap-stat"><span className="label">Dispatchés</span><span className="value">{analysis.done}</span></div>
          <div className="recap-stat"><span className="label">Non traités</span><span className="value" style={{color:analysis.notDone.length>0?"#d32f2f":"#1a4d2e"}}>{analysis.notDone.length}</span></div>
        </div>
        <div className="recap-card">
          <h3>⏱ Temps</h3>
          <div className="recap-stat"><span className="label">Début</span><span className="value">{fmtTime(analysis.startedAt)}</span></div>
          <div className="recap-stat"><span className="label">Fin</span><span className="value">{fmtTime(analysis.endedAt)}</span></div>
          <div className="recap-stat"><span className="label">Durée totale</span><span className="value">{fmtDuration(analysis.duration)}</span></div>
        </div>
        {Object.keys(analysis.byOp).length>0 && (
          <div className="recap-card">
            <h3>👥 Par opérateur</h3>
            {Object.entries(analysis.byOp).sort((a,b)=>b[1]-a[1]).map(([n,c])=>(<div className="recap-stat" key={n}><span className="label">{n}</span><span className="value">{c} produits</span></div>))}
          </div>
        )}
        {analysis.ecarts.length>0 && (
          <div className="recap-card">
            <h3>⚠️ Écarts déclarés ({analysis.ecarts.length})</h3>
            {analysis.ecarts.map((e,i)=>(
              <div className={`anomaly-item red`} key={i}>
                <div className="product">{e.designation} <span className={`pill ${e.fournisseur?"four":"int"}`}>{e.fournisseur?"avoir fourn.":"interne"}</span></div>
                <div className="detail">{e.storeLabel||e.store} : {e.planned} → {e.real} · Motif : <b>{e.reason}</b>{e.reasonText?` — ${e.reasonText}`:""}</div>
              </div>
            ))}
          </div>
        )}
        {analysis.notDone.length>0 && (
          <div className="recap-card">
            <h3>⏳ Non traités ({analysis.notDone.length})</h3>
            {analysis.notDone.map(p => (
              <div className="anomaly-item" key={p._pkey}>
                <div className="product">{p.designation}</div>
                <div className="detail">Reçu: {p.recue} • {storeColumns.map((sc,i)=><span key={sc.code}>{i>0?" / ":""}{sc.label} {(p.stores&&p.stores[sc.code])||0}</span>)}</div>
              </div>
            ))}
          </div>
        )}
        <div className="recap-card">
          <h3>📤 Envoyer le récap</h3>
          {!sent && <button className="btn-primary" onClick={sendRecap} disabled={sending}>{sending?"Envoi en cours…":"Envoyer au suivi"}</button>}
          {sent && <div style={{padding:12, background:"#e8f5e9", borderRadius:8, color:"#1a4d2e", fontWeight:600, textAlign:"center"}}>✓ Envoyé !</div>}
          {error && <div style={{padding:12, background:"#ffebee", borderRadius:8, color:"#c62828", fontSize:13, marginTop:8}}>{error}</div>}
        </div>
        <div className="recap-card">
          <h3>📄 Bons de Livraison PDF</h3>
          <p style={{fontSize:12, color:"#666", margin:"0 0 12px 0"}}>Un BL par magasin, à imprimer ou envoyer.</p>
          {(() => {
            const sessionLike = { id:sessionId, supplier, startedAt:analysis.startedAt, createdBy:operator, operators:Object.keys(analysis.byOp||{}), state };
            const activeStores = storeColumns.filter(sc => { let t=0; products.forEach(p=>{ t+=analysis.getEQ(p, sc.code); }); return t>0; });
            return (
              <>
                <button className="btn-primary" onClick={()=>generateAllBLs(sessionLike, products, storeColumns)} style={{marginBottom:8}}>📥 Tous les BL ({activeStores.length})</button>

                  {activeStores.map(sc => <button key={sc.code} className="btn-secondary" onClick={()=>generateBL(sessionLike, products, sc.code, storeColumns)}>{sc.label}</button>)}
                </div>

          <button className="btn-secondary" onClick={onLeave} style={{background:"#1a4d2e", color:"#fff", fontWeight:600}}>← Quitter et revenir à l'accueil</button>

/* =========================================================================
   PDF — BL par magasin
   ========================================================================= */
function generateBL(session, productsWithKeys, storeCode, storeColumns) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const storeCol = (storeColumns||[]).find(s=>s.code===storeCode);
  const storeName = storeCol ? storeCol.label : storeCode;
  const storeFullName = storeLong(storeCode, storeName);
  const date = session.startedAt ? new Date(session.startedAt) : new Date();
  const dateStr = date.toLocaleDateString("fr-FR");
  doc.setFillColor(26,77,46); doc.rect(0,0,210,25,"F");
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont(undefined,"bold"); doc.text("LA CENTRALE PDP", 14, 12);
  doc.setFontSize(11); doc.setFont(undefined,"normal"); doc.text("Bon de Livraison Magasin", 14, 19);
  doc.setFontSize(20); doc.setFont(undefined,"bold"); doc.text(storeName, 196, 15, { align:"right" });
  doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont(undefined,"normal");
  let y = 35;
  doc.text("Magasin destinataire :", 14, y); doc.setFont(undefined,"bold"); doc.text(storeFullName, 60, y); y+=6;
  doc.setFont(undefined,"normal"); doc.text("Fournisseur :", 14, y); doc.setFont(undefined,"bold"); doc.text(session.supplier||"?", 60, y); y+=6;
  doc.setFont(undefined,"normal"); doc.text("Date dispatch :", 14, y); doc.setFont(undefined,"bold"); doc.text(dateStr, 60, y); y+=6;
  doc.setFont(undefined,"normal"); doc.text("Préparé par :", 14, y); doc.setFont(undefined,"bold"); doc.text((session.operators||[]).join(", ")||session.createdBy||"-", 60, y); y+=10;
  const getQty = (p) => { const st=session.state[p._pkey]||{}; if (st.qtyStores && st.qtyStores[storeCode]!==undefined) return st.qtyStores[storeCode]; return (p.stores&&p.stores[storeCode])||0; };
  const items = productsWithKeys.map(p => { const st=session.state[p._pkey]||{}; const q=getQty(p); const brk=cartonSplit(q,p.colisage||0); return { ...p, _qty:q, _done:!!st.done, _colis:brk.colis, _hors:brk.hors }; }).filter(p=>p._qty>0).sort((a,b)=>a.designation.localeCompare(b.designation,"fr"));
  doc.autoTable({
    startY:y,
    head:[["Code","Désignation","Qté","Colis","✓"]],
    body: items.map(p => [ p.article||"-", p.designation, String(p._qty), (p.colisage>1?`${p._colis}c${p._hors>0?` +${p._hors}`:""}`:"—"), p._done?"✓":"" ]),
    theme:"striped",
    headStyles:{ fillColor:[26,77,46], textColor:255, fontStyle:"bold", fontSize:9 },
    styles:{ fontSize:9, cellPadding:2 },
    columnStyles:{ 0:{cellWidth:28, fontStyle:"bold"}, 1:{cellWidth:104}, 2:{cellWidth:16, halign:"center", fontStyle:"bold"}, 3:{cellWidth:22, halign:"center"}, 4:{cellWidth:12, halign:"center"} },
    margin:{ left:14, right:14 }
  });
  const totalQty = items.reduce((s,p)=>s+p._qty,0);
  const totalColis = items.reduce((s,p)=>s+p._colis,0);
  const finalY = doc.lastAutoTable.finalY + 5;
  doc.setFillColor(240,240,240); doc.rect(14, finalY, 182, 10, "F");
  doc.setFontSize(11); doc.setFont(undefined,"bold");
  doc.text(`TOTAL : ${items.length} réf. — ${totalQty} unité(s) — ${totalColis} colis`, 18, finalY+7);
  const sigY = finalY+20; doc.setFontSize(9); doc.setFont(undefined,"normal");
  doc.text("Signature préparateur :", 14, sigY); doc.text("Signature réception magasin :", 110, sigY);
  doc.rect(14, sigY+3, 80, 25); doc.rect(110, sigY+3, 80, 25);
  doc.setFontSize(8); doc.setTextColor(150,150,150);
  doc.text(`Généré le ${new Date().toLocaleString("fr-FR")} • Session: ${session.id}`, 14, 287);
  const safeName = (session.supplier||"").replace(/[^a-zA-Z0-9]/g,"");
  const safeStore = storeCode.replace(/[^a-zA-Z0-9]/g,"");
  doc.save(`BL_${safeStore}_${safeName}_${dateStr.replace(/\//g,"-")}.pdf`);
}
function generateAllBLs(session, productsWithKeys, storeColumns) {
  const activeStores = (storeColumns||[]).filter(sc => { let t=0; productsWithKeys.forEach(p=>{ const st=session.state[p._pkey]||{}; const q=(st.qtyStores&&st.qtyStores[sc.code]!==undefined)?st.qtyStores[sc.code]:((p.stores&&p.stores[sc.code])||0); t+=q; }); return t>0; });
  if (activeStores.length===0) { alert("Aucun magasin avec des produits à dispatcher."); return; }
  activeStores.forEach((sc,i)=>setTimeout(()=>generateBL(session, productsWithKeys, sc.code, storeColumns), i*300));
}

/* =========================================================================
   ÉCRAN DE NOMMAGE (magasins inconnus)
   ========================================================================= */
function NamingScreen({ supplier, products, storeColumns, onConfirm, onCancel }) {
  const [names, setNames] = useState(() => { const init={}; storeColumns.forEach(s=>{ if(s.needsNaming) init[s.code]=s.label; }); return init; });
  const [error, setError] = useState("");
  const unknown = storeColumns.filter(s=>s.needsNaming);
  const known = storeColumns.filter(s=>!s.needsNaming);
  const statsPerColumn = useMemo(() => { const stats={}; storeColumns.forEach(s=>{ let total=0,nb=0; products.forEach(p=>{ const q=p.stores[s.code]||0; if(q>0){total+=q;nb++;} }); stats[s.code]={total,nbProducts:nb}; }); return stats; }, [products, storeColumns]);
  const handleConfirm = () => {
    for (const s of unknown) { if (!(names[s.code]||"").trim()) { setError(`Donne un nom à la colonne "${s.label}"`); return; } }
    const finalCols = storeColumns.map(s => { if (s.needsNaming) { const label=names[s.code].trim(); const code=stripAccents(label).toUpperCase().replace(/[^A-Z0-9]/g,"_").slice(0,20); return { code, label, needsNaming:false }; } return s; });
    const codeMap = {}; storeColumns.forEach((old,i)=>{ codeMap[old.code]=finalCols[i].code; });
    const finalProducts = products.map(p => { const ns={}; for (const oc in p.stores) { ns[codeMap[oc]||oc]=p.stores[oc]; } return { ...p, stores:ns }; });
    onConfirm(finalProducts, finalCols);
  };
  return (
    <div className="screen-center" style={{padding:16}}>
      <div className="card" style={{maxWidth:500}}>
        <h3 style={{margin:"0 0 8px 0"}}>📋 Identifier les magasins</h3>
        <p style={{fontSize:13, color:"#666", margin:"0 0 16px 0"}}>Fournisseur : <b>{supplier}</b><br/>{unknown.length} colonne(s) inconnue(s). Indique le magasin correspondant.</p>
        {known.length>0 && (
          <div style={{marginBottom:16, padding:10, background:"#e8f5e9", borderRadius:6}}>
            <div style={{fontSize:11, fontWeight:700, color:"#1a4d2e", marginBottom:4}}>✓ MAGASINS RECONNUS</div>
            {known.map(s=>(<div key={s.code} style={{fontSize:12, color:"#333"}}>• {s.label} ({statsPerColumn[s.code].total} u. / {statsPerColumn[s.code].nbProducts} produits)</div>))}
          </div>
        )}
        {unknown.map(s => (
          <div key={s.code} style={{marginBottom:16, padding:12, background:"#fff3e0", borderRadius:8, border:"1px solid #ffcc80"}}>
            <div style={{fontSize:11, fontWeight:700, color:"#e65100", marginBottom:4}}>⚠️ COLONNE INCONNUE</div>
            <div style={{fontSize:13, marginBottom:8}}>Fichier : <b>{s.label}</b><br/><span style={{color:"#666"}}>{statsPerColumn[s.code].total} u. / {statsPerColumn[s.code].nbProducts} produits</span></div>
            <label style={{fontSize:12, fontWeight:600, color:"#555"}}>Sigle / nom du magasin</label>
            <input type="text" value={names[s.code]||""} onChange={e=>{ setNames(prev=>({...prev,[s.code]:e.target.value})); setError(""); }} placeholder="Ex: ROB, TOL, PDP…" style={{width:"100%", padding:10, fontSize:15, marginTop:4, border:"1.5px solid #ddd", borderRadius:6, textTransform:"uppercase"}} />
          </div>
        ))}
        {error && <div style={{color:"#c62828", background:"#ffebee", padding:10, borderRadius:6, fontSize:13, marginBottom:12}}>{error}</div>}
        <div className="modal-actions">
          <button className="btn-cancel" onClick={onCancel}>Annuler</button>
          <button className="btn-confirm" onClick={handleConfirm}>✓ Démarrer le dispatch</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   PORTE ADMIN — connexion Google
   ========================================================================= */
function AdminGate({ operator, onSuccess, onClose }) {
  const btnRef = useRef(null);
  const [error, setError] = useState("");
  const [googleReady, setGoogleReady] = useState(false);
  const [showFallback, setShowFallback] = useState(false);

  useEffect(() => {
    let tries = 0;
    const timer = setInterval(() => {
      tries++;
      if (window.google && window.google.accounts && window.google.accounts.id) {
        clearInterval(timer);
        try {
          window.google.accounts.id.initialize({ client_id: OAUTH_CLIENT_ID, callback: (resp) => {
            const info = decodeJwt(resp.credential);
            if (!info) { setError("Jeton Google illisible."); return; }
            if (String(info.email_verified)!=="true") { setError("Email Google non vérifié."); return; }
            if (!isAdminEmail(info.email)) { setError(`Accès refusé : ${info.email} n'est pas dans la liste admin.`); return; }
            onSuccess(info.email.toLowerCase());
          }});
          if (btnRef.current) window.google.accounts.id.renderButton(btnRef.current, { theme:"filled_blue", size:"large", text:"signin_with", width:280 });
          setGoogleReady(true);
        } catch(e) { setError("Erreur d'initialisation Google : "+e.message); setShowFallback(true); }
      } else if (tries > 20) { // ~10s
        clearInterval(timer);
        setShowFallback(true);
      }
    }, 500);
    return () => clearInterval(timer);
  }, []);

  return (
    <div className="screen-center">
      <div className="logo">🔐 Admin</div>
      <div className="tag">{BRAND}</div>
      <div className="card">
        <h3 style={{margin:"0 0 8px 0"}}>Connexion administrateur</h3>
        <p style={{fontSize:13, color:"#666", margin:"0 0 14px 0"}}>Connecte-toi avec ton compte Google professionnel. Accès réservé à : achat@probon.fr, rr@probon.fr, hg@probon.fr.</p>
        <div className="gbtn-host"><div ref={btnRef}></div></div>
        {!googleReady && !showFallback && <div className="admin-note">Chargement de la connexion Google…</div>}
        {error && <div style={{color:"#c62828", background:"#ffebee", padding:10, borderRadius:6, fontSize:13, marginTop:10}}>{error}</div>}
        {showFallback && (
          <div style={{marginTop:14, paddingTop:14, borderTop:"1px solid #eee"}}>
            <div className="admin-note" style={{marginBottom:8}}>Connexion Google indisponible (bloqueur ou origine non autorisée).</div>
            {isFallbackAdmin(operator) ? (
              <button className="btn-primary" onClick={()=>onSuccess("fallback:"+operator.toLowerCase())}>Accès de secours ({operator})</button>
            ) : (
              <div className="admin-note">Accès de secours réservé à : {FALLBACK_ADMIN_NAMES.join(", ")}. Reconnecte-toi avec ce prénom, ou débloque accounts.google.com.</div>
            )}
          </div>
        )}
        <button className="btn-secondary" onClick={onClose} style={{marginTop:12}}>← Retour à l'accueil</button>
      </div>
    </div>
  );
}

/* ---- Admin : Chargement (dispatch + BDC colisage optionnel) ----
   Le fichier dispatch est d'abord PRÉPARÉ (lu et vérifié) sans partir.
   On peut ensuite charger le BDC (colisage) optionnel dans n'importe quel ordre,
   puis cliquer « Envoyer le dispatch » pour le lancer réellement (+ feux d'artifice). */
function AdminLoad({ operator, allSessions, onSessionStart, onNeedsNaming }) {
  const [supplierName, setSupplierName] = useState("");
  const [error, setError] = useState("");
  const [bdcMap, setBdcMap] = useState(null); // {byArticle,byName,count}
  const [bdcInfo, setBdcInfo] = useState("");
  const [pending, setPending] = useState(null); // { supplier, products(bruts), storeColumns, fileName }
  const [sent, setSent] = useState(false);
  const fileRef = useRef(null);
  const bdcRef = useRef(null);

  const handleBdc = async (file) => {
    if (!file) return;
    setError("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      const map = parseBdcColisage(wb);
      if (map.count===0) { setBdcInfo("⚠️ Aucun colisage détecté dans ce BDC (colonne colisage/conditionnement manquante). Le dispatch fonctionnera sans."); setBdcMap(null); }
      else { setBdcMap(map); setBdcInfo(`✓ BDC chargé : ${map.count} colisages détectés. Ils seront appliqués à l'envoi du dispatch.`); }
    } catch(e) { setBdcInfo(`Erreur BDC : ${e.message}`); setBdcMap(null); }
  };

  // Lit et PRÉPARE le fichier dispatch (ne l'envoie pas encore).
  const processFile = async (file) => {
    setError("");
    if (!file) return;
    if (!supplierName.trim()) { setError("Indique d'abord le nom du fournisseur."); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array" });
      let { products, storeColumns } = parseExcelFile(wb);
      if (products.length===0) { setError("Aucun produit trouvé dans le fichier."); return; }
      setPending({ supplier: supplierName.trim(), products, storeColumns, fileName: file.name||"dispatch" });
    } catch(e) { setError(`Erreur de lecture: ${e.message}`); setPending(null); }
  };

  // Envoi RÉEL du dispatch : applique le colisage, lance les feux d'artifice, démarre la session.
  const sendDispatch = () => {
    if (!pending) { setError("Charge d'abord le fichier dispatch."); return; }
    const supplier = (supplierName.trim() || pending.supplier);
    let products = pending.products;
    if (bdcMap) products = applyColisage(products, bdcMap);
    setSent(true);
    launchConfetti();
    if (pending.storeColumns.some(s=>s.needsNaming)) { onNeedsNaming({ supplier, products, storeColumns: pending.storeColumns }); return; }
    const sessionId = `${stripAccents(supplier).replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()}_${Date.now()}`;
    onSessionStart(sessionId, supplier, products, pending.storeColumns);
  };

  const resetPending = () => { setPending(null); setSent(false); setError(""); if(fileRef.current) fileRef.current.value=""; };

  const nbStores = pending ? pending.storeColumns.length : 0;
  const totalUnits = pending ? pending.products.reduce((a,p)=>a+Object.values(p.stores||{}).reduce((x,y)=>x+(y||0),0),0) : 0;

  return (
    <>
      <div className="recap-card">
        <h3>📥 Préparer un dispatch</h3>
        <div className="field">
          <label>Nom du fournisseur *</label>
          <input type="text" value={supplierName} onChange={e=>{ setSupplierName(e.target.value); setError(""); }} placeholder="Ex: SBV, GABORIT, VIN…" style={{textTransform:"uppercase"}} disabled={!!pending} />
        </div>
        {!pending && (
          <>
            <div className="upload-zone" onClick={()=>{ if(!supplierName.trim()){ setError("⚠️ Saisis d'abord le nom du fournisseur"); return; } fileRef.current&&fileRef.current.click(); }} style={{opacity:supplierName.trim()?1:0.5}}>
              <div className="icon">📄</div>
              <div className="label">Charger le fichier dispatch (Excel)</div>
              <div className="hint">.xlsx ou .xls — la commande répartie par magasin</div>
            </div>
            <p style={{fontSize:12, color:"#666", margin:"10px 0 0 0"}}>Le dispatch <b>ne part pas</b> tout de suite : tu pourras charger le bon de commande (colisage) ci-dessous, puis cliquer <b>Envoyer le dispatch</b>.</p>
          </>
        )}
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>processFile(e.target.files[0])} />
        {pending && (
          <div style={{background:"#e8f5e9", border:"1.5px solid #a5d6a7", borderRadius:8, padding:12, marginTop:4}}>
            <div style={{fontWeight:700, color:"#1a4d2e"}}>✓ Fichier prêt : {pending.fileName}</div>
            <div style={{fontSize:13, color:"#333", marginTop:4}}>Fournisseur : <b>{supplierName.trim()||pending.supplier}</b></div>
            <div style={{fontSize:13, color:"#333"}}>{pending.products.length} produit(s) · {nbStores} magasin(s) · {totalUnits} unité(s) au total</div>
            <div style={{fontSize:12, color:"#666", marginTop:4}}>{bdcMap ? `📦 Colisage BDC prêt (${bdcMap.count} réf.) — appliqué à l'envoi.` : "Colisage BDC : aucun (optionnel)."}</div>
            <button className="btn-secondary" onClick={resetPending} style={{marginTop:8, fontSize:13}}>↺ Changer de fichier</button>
          </div>
        )}
        {error && <div style={{color:"#d32f2f", fontSize:13, marginTop:12}}>{error}</div>}
      </div>

      <div className="recap-card">
        <h3>📦 Bon de commande (colisage) — optionnel</h3>
        <p style={{fontSize:12, color:"#666", margin:"0 0 10px 0"}}>Charge le BDC fournisseur pour connaître le colisage (ex. C6 = 6 unités) — <b>avant ou après</b> le fichier dispatch, peu importe. L'app calcule alors les cartons par magasin. Sans BDC, pas grave.</p>
        <div className="upload-zone bdc" onClick={()=>bdcRef.current&&bdcRef.current.click()}>
          <div className="icon">🧾</div>
          <div className="label">Charger le BDC (Excel)</div>
          <div className="hint">colonne colisage / conditionnement</div>
        </div>
        <input ref={bdcRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>handleBdc(e.target.files[0])} />

          {sent ? "🎉 Dispatch envoyé !" : "🚀 Envoyer le dispatch"}
        </button>
        {!pending && <p className="admin-note" style={{marginTop:8}}>Charge d'abord le fichier dispatch ci-dessus.</p>}
